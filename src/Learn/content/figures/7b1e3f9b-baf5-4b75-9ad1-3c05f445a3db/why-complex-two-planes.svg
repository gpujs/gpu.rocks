<svg viewBox="0 0 440 196" role="img" aria-label="On the left, one tone correlated against a cosine scores 128, while the same tone delayed by eight samples scores zero. On the right, both readings plotted as a real and imaginary pair: the delay swings the point a quarter turn around a circle of radius 128, from (128, 0) to (0, minus 128), leaving the radius unchanged.">
  <text x="10" y="13" class="lbl-up">COSINE ONLY</text>
  <text x="228" y="13" class="lbl-up">BOTH PLANES</text>
  <line x1="214" y1="10" x2="214" y2="184" class="cellline"/>

  <!-- left: the tone, and the same tone eight samples late -->
  <text x="10" y="32" class="lbl">tone</text>
  <path d="M10 56 H 146" class="arrow" stroke-dasharray="2 3"/>
  <path d="M14.0 42.0 L20.0 44.4 L26.0 50.6 L32.0 58.7 L38.0 65.9 L44.0 69.7 L50.0 68.9 L56.0 63.8 L62.0 56.0 L68.0 48.2 L74.0 43.1 L80.0 42.3 L86.0 46.1 L92.0 53.3 L98.0 61.4 L104.0 67.6 L110.0 70.0 L116.0 67.6 L122.0 61.4 L128.0 53.3 L134.0 46.1 L140.0 42.3 L142.0 42.0"
    fill="none" stroke="var(--muted)" stroke-width="1.5"/>
  <rect x="152" y="44" width="52" height="24" rx="6" fill="var(--teal)" fill-opacity=".18" stroke="var(--teal)" stroke-width="1.5"/>
  <text x="178" y="60" text-anchor="middle" style="font-size:11px" fill="var(--teal)">128</text>

  <text x="10" y="100" class="lbl">delayed 8 samples</text>
  <path d="M10 124 H 146" class="arrow" stroke-dasharray="2 3"/>
  <path d="M14.0 124.0 L20.0 116.2 L26.0 111.1 L32.0 110.3 L38.0 114.1 L44.0 121.3 L50.0 129.4 L56.0 135.6 L62.0 138.0 L68.0 135.6 L74.0 129.4 L80.0 121.3 L86.0 114.1 L92.0 110.3 L98.0 111.1 L104.0 116.2 L110.0 124.0 L116.0 131.8 L122.0 136.9 L128.0 137.7 L134.0 133.9 L140.0 126.7 L142.0 124.0"
    fill="none" stroke="var(--pink)" stroke-width="1.5"/>
  <rect x="152" y="112" width="52" height="24" rx="6" fill="var(--lred)" fill-opacity=".22" stroke="var(--lred)" stroke-width="1.5"/>
  <text x="178" y="128" text-anchor="middle" style="font-size:11px" fill="var(--lred)">0</text>
  <text x="10" y="170" style="font-size:9px" fill="var(--lred)">same tone. no answer.</text>

  <!-- right: the pair, on a circle whose radius is the answer -->
  <text x="322" y="34" text-anchor="middle" class="lbl" fill="var(--teal)">radius |X| = 128</text>
  <circle cx="322" cy="98" r="52" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>
  <path d="M262 98 H 386 M322 38 V 158" class="arrow" stroke-width="1"/>
  <text x="390" y="94" class="lbl">real</text>
  <text x="330" y="168" class="lbl">imaginary</text>

  <path d="M322 98 H 374" stroke="var(--teal)" stroke-width="1.6" fill="none"/>
  <circle cx="374" cy="98" r="4" fill="var(--teal)"/>
  <text x="374" y="84" text-anchor="middle" style="font-size:9px" fill="var(--teal)">(128, 0)</text>

  <path d="M322 98 V 150" stroke="var(--pink)" stroke-width="1.6" fill="none"/>
  <circle cx="322" cy="150" r="4" fill="var(--pink)"/>
  <text x="314" y="146" text-anchor="end" style="font-size:9px" fill="var(--pink)">(0, −128)</text>

  <path d="M374 98 A 52 52 0 0 1 330 145" fill="none" stroke="var(--pink)" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M325.1 145.8 L330.5 148.1 L329.5 142.2 Z" fill="var(--pink)"/>
  <text x="366" y="136" style="font-size:9px" fill="var(--pink)">delay</text>
</svg>
