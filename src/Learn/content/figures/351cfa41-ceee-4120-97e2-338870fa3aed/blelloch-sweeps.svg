<svg viewBox="0 0 440 250" role="img" aria-label="A Blelloch scan over eight cells. Three upsweep passes at strides 1, 2 and 4 build a tree of subtotals, leaving the grand total 31 in the last cell. That cell is set to zero, then three downsweep passes at strides 4, 2 and 1 push values back down the tree, ending with the exclusive scan 0, 3, 4, 8, 9, 14, 23, 25.">
  <text x="10" y="12" class="lbl-up">UPSWEEP, THEN DOWNSWEEP</text>

  <!-- input -->
  <g fill="none" stroke="var(--line)">
    <rect x="96" y="22" width="30" height="16" rx="3"/><rect x="130" y="22" width="30" height="16" rx="3"/>
    <rect x="164" y="22" width="30" height="16" rx="3"/><rect x="198" y="22" width="30" height="16" rx="3"/>
    <rect x="232" y="22" width="30" height="16" rx="3"/><rect x="266" y="22" width="30" height="16" rx="3"/>
    <rect x="300" y="22" width="30" height="16" rx="3"/><rect x="334" y="22" width="30" height="16" rx="3"/>
  </g>
  <g style="font-size:9px" text-anchor="middle">
    <text x="111" y="34">3</text><text x="145" y="34">1</text><text x="179" y="34">4</text><text x="213" y="34">1</text>
    <text x="247" y="34">5</text><text x="281" y="34">9</text><text x="315" y="34">2</text><text x="349" y="34">6</text>
  </g>
  <text x="88" y="34" text-anchor="end" class="lbl">input</text>

  <!-- upsweep, stride 1: cells 1, 3, 5, 7 absorb their left neighbour -->
  <g class="arrow" stroke-width="1.1" opacity=".4">
    <path d="M111 40 L 145 48"/><path d="M179 40 L 213 48"/><path d="M247 40 L 281 48"/><path d="M315 40 L 349 48"/>
  </g>
  <g fill="none" stroke="var(--line)">
    <rect x="96" y="50" width="30" height="16" rx="3"/><rect x="164" y="50" width="30" height="16" rx="3"/>
    <rect x="232" y="50" width="30" height="16" rx="3"/><rect x="300" y="50" width="30" height="16" rx="3"/>
  </g>
  <g fill="none" stroke="var(--blue)" stroke-width="1.5">
    <rect x="130" y="50" width="30" height="16" rx="3"/><rect x="198" y="50" width="30" height="16" rx="3"/>
    <rect x="266" y="50" width="30" height="16" rx="3"/><rect x="334" y="50" width="30" height="16" rx="3"/>
  </g>
  <g style="font-size:9px" text-anchor="middle">
    <text x="111" y="62" class="lbl" style="font-size:9px">3</text><text x="145" y="62" fill="var(--blue)">4</text>
    <text x="179" y="62" class="lbl" style="font-size:9px">4</text><text x="213" y="62" fill="var(--blue)">5</text>
    <text x="247" y="62" class="lbl" style="font-size:9px">5</text><text x="281" y="62" fill="var(--blue)">14</text>
    <text x="315" y="62" class="lbl" style="font-size:9px">2</text><text x="349" y="62" fill="var(--blue)">8</text>
  </g>
  <text x="88" y="62" text-anchor="end" class="lbl">up s=1</text>

  <!-- upsweep, stride 2: cells 3 and 7 -->
  <g class="arrow" stroke-width="1.1" opacity=".4">
    <path d="M145 68 L 213 76"/><path d="M281 68 L 349 76"/>
  </g>
  <g fill="none" stroke="var(--line)">
    <rect x="96" y="78" width="30" height="16" rx="3"/><rect x="130" y="78" width="30" height="16" rx="3"/>
    <rect x="164" y="78" width="30" height="16" rx="3"/><rect x="232" y="78" width="30" height="16" rx="3"/>
    <rect x="266" y="78" width="30" height="16" rx="3"/><rect x="300" y="78" width="30" height="16" rx="3"/>
  </g>
  <g fill="none" stroke="var(--blue)" stroke-width="1.5">
    <rect x="198" y="78" width="30" height="16" rx="3"/><rect x="334" y="78" width="30" height="16" rx="3"/>
  </g>
  <g style="font-size:9px" text-anchor="middle" class="lbl">
    <text x="111" y="90" style="font-size:9px">3</text><text x="145" y="90" style="font-size:9px">4</text>
    <text x="179" y="90" style="font-size:9px">4</text><text x="247" y="90" style="font-size:9px">5</text>
    <text x="281" y="90" style="font-size:9px">14</text><text x="315" y="90" style="font-size:9px">2</text>
  </g>
  <g style="font-size:9px" text-anchor="middle" fill="var(--blue)">
    <text x="213" y="90">9</text><text x="349" y="90">22</text>
  </g>
  <text x="88" y="90" text-anchor="end" class="lbl">up s=2</text>

  <!-- upsweep, stride 4: cell 7 only — the root -->
  <g class="arrow" stroke-width="1.1" opacity=".4">
    <path d="M213 96 L 349 104"/>
  </g>
  <g fill="none" stroke="var(--line)">
    <rect x="96" y="106" width="30" height="16" rx="3"/><rect x="130" y="106" width="30" height="16" rx="3"/>
    <rect x="164" y="106" width="30" height="16" rx="3"/><rect x="198" y="106" width="30" height="16" rx="3"/>
    <rect x="232" y="106" width="30" height="16" rx="3"/><rect x="266" y="106" width="30" height="16" rx="3"/>
    <rect x="300" y="106" width="30" height="16" rx="3"/>
  </g>
  <rect x="334" y="106" width="30" height="16" rx="3" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
  <g style="font-size:9px" text-anchor="middle" class="lbl">
    <text x="111" y="118" style="font-size:9px">3</text><text x="145" y="118" style="font-size:9px">4</text>
    <text x="179" y="118" style="font-size:9px">4</text><text x="213" y="118" style="font-size:9px">9</text>
    <text x="247" y="118" style="font-size:9px">5</text><text x="281" y="118" style="font-size:9px">14</text>
    <text x="315" y="118" style="font-size:9px">2</text>
  </g>
  <text x="349" y="118" text-anchor="middle" style="font-size:9px" fill="var(--blue)">31</text>
  <text x="88" y="118" text-anchor="end" class="lbl">up s=4</text>
  <text x="372" y="118" class="lbl">= total</text>

  <!-- clear the root -->
  <line x1="10" y1="130" x2="430" y2="130" class="cellline"/>
  <g fill="none" stroke="var(--line)">
    <rect x="96" y="136" width="30" height="16" rx="3"/><rect x="130" y="136" width="30" height="16" rx="3"/>
    <rect x="164" y="136" width="30" height="16" rx="3"/><rect x="198" y="136" width="30" height="16" rx="3"/>
    <rect x="232" y="136" width="30" height="16" rx="3"/><rect x="266" y="136" width="30" height="16" rx="3"/>
    <rect x="300" y="136" width="30" height="16" rx="3"/>
  </g>
  <rect x="334" y="136" width="30" height="16" rx="3" fill="var(--teal)" fill-opacity=".18" stroke="var(--teal)" stroke-width="1.6"/>
  <g style="font-size:9px" text-anchor="middle" class="lbl">
    <text x="111" y="148" style="font-size:9px">3</text><text x="145" y="148" style="font-size:9px">4</text>
    <text x="179" y="148" style="font-size:9px">4</text><text x="213" y="148" style="font-size:9px">9</text>
    <text x="247" y="148" style="font-size:9px">5</text><text x="281" y="148" style="font-size:9px">14</text>
    <text x="315" y="148" style="font-size:9px">2</text>
  </g>
  <text x="349" y="148" text-anchor="middle" style="font-size:9px" fill="var(--teal)">0</text>
  <text x="88" y="148" text-anchor="end" class="lbl">clear</text>
  <text x="372" y="148" class="lbl">root := 0</text>

  <!-- downsweep, stride 4: cell 3 takes the root's old 0, cell 7 adds 9 -->
  <g fill="none" stroke="var(--pink)" stroke-width="1.2" opacity=".8">
    <path d="M349 154 L 213 164"/><path d="M213 154 L 349 164"/>
  </g>
  <g fill="none" stroke="var(--line)">
    <rect x="96" y="166" width="30" height="16" rx="3"/><rect x="130" y="166" width="30" height="16" rx="3"/>
    <rect x="164" y="166" width="30" height="16" rx="3"/><rect x="232" y="166" width="30" height="16" rx="3"/>
    <rect x="266" y="166" width="30" height="16" rx="3"/><rect x="300" y="166" width="30" height="16" rx="3"/>
  </g>
  <g fill="none" stroke="var(--pink)" stroke-width="1.5">
    <rect x="198" y="166" width="30" height="16" rx="3"/><rect x="334" y="166" width="30" height="16" rx="3"/>
  </g>
  <g style="font-size:9px" text-anchor="middle" class="lbl">
    <text x="111" y="178" style="font-size:9px">3</text><text x="145" y="178" style="font-size:9px">4</text>
    <text x="179" y="178" style="font-size:9px">4</text><text x="247" y="178" style="font-size:9px">5</text>
    <text x="281" y="178" style="font-size:9px">14</text><text x="315" y="178" style="font-size:9px">2</text>
  </g>
  <g style="font-size:9px" text-anchor="middle" fill="var(--pink)">
    <text x="213" y="178">0</text><text x="349" y="178">9</text>
  </g>
  <text x="88" y="178" text-anchor="end" class="lbl">down s=4</text>

  <!-- downsweep, stride 2 -->
  <g fill="none" stroke="var(--pink)" stroke-width="1.2" opacity=".55">
    <path d="M213 184 L 145 192"/><path d="M145 184 L 213 192"/>
    <path d="M349 184 L 281 192"/><path d="M281 184 L 349 192"/>
  </g>
  <g fill="none" stroke="var(--line)">
    <rect x="96" y="194" width="30" height="16" rx="3"/><rect x="164" y="194" width="30" height="16" rx="3"/>
    <rect x="232" y="194" width="30" height="16" rx="3"/><rect x="300" y="194" width="30" height="16" rx="3"/>
  </g>
  <g fill="none" stroke="var(--pink)" stroke-width="1.5">
    <rect x="130" y="194" width="30" height="16" rx="3"/><rect x="198" y="194" width="30" height="16" rx="3"/>
    <rect x="266" y="194" width="30" height="16" rx="3"/><rect x="334" y="194" width="30" height="16" rx="3"/>
  </g>
  <g style="font-size:9px" text-anchor="middle" class="lbl">
    <text x="111" y="206" style="font-size:9px">3</text><text x="179" y="206" style="font-size:9px">4</text>
    <text x="247" y="206" style="font-size:9px">5</text><text x="315" y="206" style="font-size:9px">2</text>
  </g>
  <g style="font-size:9px" text-anchor="middle" fill="var(--pink)">
    <text x="145" y="206">0</text><text x="213" y="206">4</text><text x="281" y="206">9</text><text x="349" y="206">23</text>
  </g>
  <text x="88" y="206" text-anchor="end" class="lbl">down s=2</text>

  <!-- downsweep, stride 1 — the exclusive scan -->
  <g fill="none" stroke="var(--pink)" stroke-width="1.1" opacity=".4">
    <path d="M145 212 L 111 220"/><path d="M111 212 L 145 220"/>
    <path d="M213 212 L 179 220"/><path d="M179 212 L 213 220"/>
    <path d="M281 212 L 247 220"/><path d="M247 212 L 281 220"/>
    <path d="M349 212 L 315 220"/><path d="M315 212 L 349 220"/>
  </g>
  <g fill="var(--teal)" fill-opacity=".18" stroke="var(--teal)" stroke-width="1.5">
    <rect x="96" y="222" width="30" height="16" rx="3"/><rect x="130" y="222" width="30" height="16" rx="3"/>
    <rect x="164" y="222" width="30" height="16" rx="3"/><rect x="198" y="222" width="30" height="16" rx="3"/>
    <rect x="232" y="222" width="30" height="16" rx="3"/><rect x="266" y="222" width="30" height="16" rx="3"/>
    <rect x="300" y="222" width="30" height="16" rx="3"/><rect x="334" y="222" width="30" height="16" rx="3"/>
  </g>
  <g style="font-size:9px" text-anchor="middle" fill="var(--teal)">
    <text x="111" y="234">0</text><text x="145" y="234">3</text><text x="179" y="234">4</text><text x="213" y="234">8</text>
    <text x="247" y="234">9</text><text x="281" y="234">14</text><text x="315" y="234">23</text><text x="349" y="234">25</text>
  </g>
  <text x="88" y="234" text-anchor="end" class="lbl">down s=1</text>
  <text x="372" y="234" class="lbl">exclusive</text>
</svg>
