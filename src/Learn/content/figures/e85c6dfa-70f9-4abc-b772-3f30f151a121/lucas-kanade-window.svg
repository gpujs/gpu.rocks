<svg viewBox="0 0 440 156" role="img" aria-label="A five by five window of pixels, each contributing one brightness-constancy equation. The twenty-five equations are gathered into five running sums, which fill a two by two matrix and its right-hand side, solved once for the window's centre pixel.">
  <text x="10" y="14" class="lbl-up">TWENTY-FIVE EQUATIONS, ONE SOLVE</text>
  <text x="430" y="14" text-anchor="end" class="lbl">Ix&#183;u + Iy&#183;v + It = 0, per cell</text>

  <!-- the window: one equation per cell, one answer for the centre -->
  <text x="63" y="34" text-anchor="middle" class="lbl">5 &#215; 5 window</text>
  <g fill="none" stroke="var(--line)">
    <rect x="26" y="42" width="14" height="14" rx="2"/><rect x="41" y="42" width="14" height="14" rx="2"/><rect x="56" y="42" width="14" height="14" rx="2"/><rect x="71" y="42" width="14" height="14" rx="2"/><rect x="86" y="42" width="14" height="14" rx="2"/>
    <rect x="26" y="57" width="14" height="14" rx="2"/><rect x="41" y="57" width="14" height="14" rx="2"/><rect x="56" y="57" width="14" height="14" rx="2"/><rect x="71" y="57" width="14" height="14" rx="2"/><rect x="86" y="57" width="14" height="14" rx="2"/>
    <rect x="26" y="72" width="14" height="14" rx="2"/><rect x="41" y="72" width="14" height="14" rx="2"/><rect x="71" y="72" width="14" height="14" rx="2"/><rect x="86" y="72" width="14" height="14" rx="2"/>
    <rect x="26" y="87" width="14" height="14" rx="2"/><rect x="41" y="87" width="14" height="14" rx="2"/><rect x="56" y="87" width="14" height="14" rx="2"/><rect x="71" y="87" width="14" height="14" rx="2"/><rect x="86" y="87" width="14" height="14" rx="2"/>
    <rect x="26" y="102" width="14" height="14" rx="2"/><rect x="41" y="102" width="14" height="14" rx="2"/><rect x="56" y="102" width="14" height="14" rx="2"/><rect x="71" y="102" width="14" height="14" rx="2"/><rect x="86" y="102" width="14" height="14" rx="2"/>
  </g>
  <rect x="56" y="72" width="14" height="14" rx="2" fill="var(--blue)" fill-opacity=".22" stroke="var(--blue)" stroke-width="1.4"/>
  <rect x="23" y="39" width="80" height="80" rx="5" fill="none" stroke="var(--blue)" stroke-width="1.4"/>
  <text x="63" y="134" text-anchor="middle" class="lbl">25 equations</text>

  <!-- gathered into five running sums -->
  <path d="M106 49 L 138 74" class="arrow" stroke-width="1.2"/>
  <path d="M106 109 L 138 84" class="arrow" stroke-width="1.2"/>
  <path d="M106 79 H 138" class="arrow" stroke-width="1.2"/>
  <path d="M142 79 l -7 -4 v 8 z" class="arrowhead"/>

  <g style="font-size:10px" fill="var(--ink)">
    <text x="148" y="49">Sxx = &#8721; Ix&#178;</text>
    <text x="148" y="65" fill="var(--pink)">Sxy = &#8721; Ix&#183;Iy</text>
    <text x="148" y="81">Syy = &#8721; Iy&#178;</text>
    <text x="148" y="97">Sxt = &#8721; Ix&#183;It</text>
    <text x="148" y="113">Syt = &#8721; Iy&#183;It</text>
  </g>
  <text x="185" y="134" text-anchor="middle" class="lbl">5 sums</text>

  <!-- one 2x2 system, closed form -->
  <path d="M230 79 H 254" class="arrow" stroke-width="1.2"/>
  <path d="M258 79 l -7 -4 v 8 z" class="arrowhead"/>

  <rect x="264" y="55" width="62" height="48" rx="4" fill="none" stroke="var(--line)" stroke-width="1.3"/>
  <g style="font-size:10px" text-anchor="middle" fill="var(--ink)">
    <text x="281" y="74">Sxx</text><text x="311" y="74" fill="var(--pink)">Sxy</text>
    <text x="281" y="94" fill="var(--pink)">Sxy</text><text x="311" y="94">Syy</text>
  </g>
  <rect x="332" y="55" width="26" height="48" rx="4" fill="var(--teal)" fill-opacity=".16" stroke="var(--teal)" stroke-width="1.3"/>
  <g style="font-size:10px" text-anchor="middle" fill="var(--teal)">
    <text x="345" y="74">u</text><text x="345" y="94">v</text>
  </g>
  <text x="370" y="83" text-anchor="middle" style="font-size:11px" fill="var(--ink)">= &#8722;</text>
  <rect x="382" y="55" width="30" height="48" rx="4" fill="none" stroke="var(--line)" stroke-width="1.3"/>
  <g style="font-size:10px" text-anchor="middle" fill="var(--ink)">
    <text x="397" y="74">Sxt</text><text x="397" y="94">Syt</text>
  </g>
  <text x="338" y="134" text-anchor="middle" class="lbl">1 answer</text>

  <text x="220" y="150" text-anchor="middle" class="formula">4,096 of these, all at once</text>
</svg>
