<svg viewBox="0 0 440 162" role="img" aria-label="Eight scores in a row. The highlighted score counts the scores that outrank it: two strictly larger scores count, and an equal score at a lower index counts, while an equal score at a higher index does not. The total, three, is its rank and its output slot.">
  <text x="10" y="14" class="lbl-up">RANK = HOW MANY BEAT ME</text>

  <!-- the three reads that count -->
  <g fill="none" stroke="var(--blue)" stroke-width="1.3">
    <path d="M101 62 Q 139 26 176 58"/>
    <path d="M143 62 Q 164 40 184 58"/>
    <path d="M269 62 Q 231 26 194 58"/>
  </g>
  <g fill="var(--blue)">
    <path d="M177 62 l -6.4 -4.6 l 7.8 -2.6 z"/>
    <path d="M185 62 l -4.2 -6.6 l 8.2 0.2 z"/>
    <path d="M193 62 l 6.4 -4.6 l -7.8 -2.6 z"/>
  </g>

  <!-- the tie that does not count: passive data, so it stays muted -->
  <text x="311" y="44" text-anchor="middle" class="lbl">equal, but later</text>
  <path class="arrow" d="M305 50 l 12 10 M317 50 l -12 10" stroke-width="1.2"/>

  <!-- the scores -->
  <g fill="none" stroke="var(--line)">
    <rect x="42" y="64" width="34" height="24" rx="4"/>
    <rect x="210" y="64" width="34" height="24" rx="4"/>
    <rect x="294" y="64" width="34" height="24" rx="4"/>
    <rect x="336" y="64" width="34" height="24" rx="4"/>
  </g>
  <g fill="none" stroke="var(--blue)" stroke-width="1.5">
    <rect x="84" y="64" width="34" height="24" rx="4"/>
    <rect x="126" y="64" width="34" height="24" rx="4"/>
    <rect x="252" y="64" width="34" height="24" rx="4"/>
  </g>
  <rect x="168" y="64" width="34" height="24" rx="4" fill="var(--pink)" fill-opacity=".12" stroke="var(--pink)" stroke-width="1.8"/>

  <g style="font-size:11px" text-anchor="middle">
    <text x="59" y="80" style="fill:var(--muted)">4</text>
    <text x="101" y="80" style="fill:var(--blue)">9</text>
    <text x="143" y="80" style="fill:var(--blue)">7</text>
    <text x="185" y="80" style="fill:var(--pink)">7</text>
    <text x="227" y="80" style="fill:var(--muted)">2</text>
    <text x="269" y="80" style="fill:var(--blue)">9</text>
    <text x="311" y="80" style="fill:var(--muted)">7</text>
    <text x="353" y="80" style="fill:var(--muted)">6</text>
  </g>

  <!-- class="lbl" has to sit on each <text>: the shared
       `.diagram svg text { fill: var(--ink) }` rule outranks a fill inherited
       from a parent <g>, so a wrapper class silently renders as ink -->
  <g text-anchor="middle">
    <text x="59" y="101" class="lbl">0</text><text x="101" y="101" class="lbl">1</text>
    <text x="143" y="101" class="lbl">2</text><text x="185" y="101" class="lbl">3</text>
    <text x="227" y="101" class="lbl">4</text><text x="269" y="101" class="lbl">5</text>
    <text x="311" y="101" class="lbl">6</text><text x="353" y="101" class="lbl">7</text>
  </g>

  <!-- the count falls out as the rank -->
  <path class="arrow" d="M185 106 v 8" stroke-width="1.1"/>
  <rect x="166" y="116" width="38" height="22" rx="5" fill="var(--teal)" fill-opacity=".18" stroke="var(--teal)" stroke-width="1.6"/>
  <text x="185" y="131" text-anchor="middle" style="font-size:11px;fill:var(--teal)">3</text>
  <text x="212" y="131" class="lbl">outrank me → I own slot 3</text>

  <text x="220" y="155" text-anchor="middle" class="formula">earlier tie: &gt;=  ·  later tie: &gt;</text>
</svg>
