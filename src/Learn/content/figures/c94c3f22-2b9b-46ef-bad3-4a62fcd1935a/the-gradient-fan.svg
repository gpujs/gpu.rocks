<svg viewBox="0 0 440 172" role="img" aria-label="One pass over the 4,096 residuals feeds two accumulators at once: weighted by x it fills output row 0 with the sum r times x, weighted by one it fills row 1 with the sum of r, and the two totals scaled by 2 over n are the gradient minus six, minus eight.">
  <text x="10" y="13" class="lbl-up">ONE WALK, TWO SUMS</text>
  <text x="30" y="28" class="lbl">rᵢ = m·xᵢ + c − yᵢ</text>

  <!-- the residuals, read once -->
  <g fill="none" stroke="var(--line)">
    <rect x="30" y="34" width="28" height="22" rx="4"/><rect x="62" y="34" width="28" height="22" rx="4"/>
    <rect x="94" y="34" width="28" height="22" rx="4"/><rect x="126" y="34" width="28" height="22" rx="4"/>
    <rect x="158" y="34" width="28" height="22" rx="4"/><rect x="190" y="34" width="28" height="22" rx="4"/>
    <rect x="222" y="34" width="28" height="22" rx="4"/><rect x="254" y="34" width="28" height="22" rx="4"/>
    <rect x="286" y="34" width="28" height="22" rx="4"/>
  </g>
  <g style="font-size:9px" text-anchor="middle" class="lbl">
    <text x="44" y="49">r₀</text><text x="76" y="49">r₁</text><text x="108" y="49">r₂</text>
    <text x="140" y="49">r₃</text><text x="172" y="49">r₄</text><text x="204" y="49">r₅</text>
    <text x="236" y="49">r₆</text><text x="268" y="49">r₇</text><text x="300" y="49">r₈</text>
  </g>
  <text x="322" y="49" class="lbl">… 4,096</text>

  <!-- the same residual pushed into two accumulators -->
  <path d="M168 58 Q140 74 114 86" fill="none" stroke="var(--blue)" stroke-width="1.3"/>
  <path d="M112 90 L 119.6 86.3 L 116.1 81.4 Z" fill="var(--blue)"/>
  <path d="M180 58 Q252 74 324 86" fill="none" stroke="var(--pink)" stroke-width="1.3"/>
  <path d="M326 90 L 318.6 85.9 L 322.4 81.2 Z" fill="var(--pink)"/>
  <text x="122" y="72" style="font-size:10px" fill="var(--blue)">× xᵢ</text>
  <text x="252" y="72" style="font-size:10px" fill="var(--pink)">× 1</text>

  <!-- output row 0 : the slope partials -->
  <text x="24" y="102" style="font-size:9px" fill="var(--blue)">output row 0 · 64 partials</text>
  <g fill="none" stroke="var(--blue)" stroke-width="1.4">
    <rect x="24" y="108" width="20" height="18" rx="4"/><rect x="48" y="108" width="20" height="18" rx="4"/>
    <rect x="72" y="108" width="20" height="18" rx="4"/><rect x="96" y="108" width="20" height="18" rx="4"/>
    <rect x="120" y="108" width="20" height="18" rx="4"/><rect x="144" y="108" width="20" height="18" rx="4"/>
    <rect x="168" y="108" width="20" height="18" rx="4"/>
  </g>

  <!-- output row 1 : the intercept partials -->
  <text x="244" y="102" style="font-size:9px" fill="var(--pink)">output row 1 · 64 partials</text>
  <g fill="none" stroke="var(--pink)" stroke-width="1.4">
    <rect x="244" y="108" width="20" height="18" rx="4"/><rect x="268" y="108" width="20" height="18" rx="4"/>
    <rect x="292" y="108" width="20" height="18" rx="4"/><rect x="316" y="108" width="20" height="18" rx="4"/>
    <rect x="340" y="108" width="20" height="18" rx="4"/><rect x="364" y="108" width="20" height="18" rx="4"/>
    <rect x="388" y="108" width="20" height="18" rx="4"/>
  </g>

  <text x="106" y="142" text-anchor="middle" style="font-size:10px" fill="var(--teal)">Σ r·x = −12,288</text>
  <text x="326" y="142" text-anchor="middle" style="font-size:10px" fill="var(--teal)">Σ r = −16,384</text>

  <text x="220" y="164" text-anchor="middle" class="formula">∇L = (2/n)·(Σ r·x, Σ r) = (−6, −8)</text>
</svg>
