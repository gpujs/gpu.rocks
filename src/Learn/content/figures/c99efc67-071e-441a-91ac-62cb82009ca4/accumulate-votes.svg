<svg viewBox="0 0 440 180" role="img" aria-label="Four traced frames feeding a running average. Each frame enters the average with weight one over n plus one, while the average carried forward from the previous pass keeps weight n over n plus one, so every frame ends up with an equal vote. The carried average is drawn as the state that outlives the frame.">
  <text x="10" y="14" class="lbl-up">EVERY FRAME GETS ONE VOTE</text>
  <text x="10" y="44" class="lbl-up">SAMPLE</text>
  <text x="10" y="128" class="lbl-up">AVERAGE</text>

  <!-- one traced frame per pass -->
  <g fill="none" stroke="var(--blue)" stroke-width="1.5">
    <rect x="70" y="28" width="64" height="24" rx="7"/>
    <rect x="160" y="28" width="64" height="24" rx="7"/>
    <rect x="250" y="28" width="64" height="24" rx="7"/>
    <rect x="340" y="28" width="64" height="24" rx="7"/>
  </g>
  <g text-anchor="middle" style="font-size:9px;fill:var(--blue)">
    <text x="102" y="44">trace 0</text>
    <text x="192" y="44">trace 1</text>
    <text x="282" y="44">trace 2</text>
    <text x="372" y="44">trace 3</text>
  </g>

  <!-- the running average, one fresh texture per pass -->
  <g fill="var(--teal)" fill-opacity=".12" stroke="var(--teal)" stroke-width="1.5">
    <rect x="70" y="108" width="64" height="26" rx="7"/>
    <rect x="160" y="108" width="64" height="26" rx="7"/>
    <rect x="250" y="108" width="64" height="26" rx="7"/>
    <rect x="340" y="108" width="64" height="26" rx="7"/>
  </g>
  <g text-anchor="middle" style="font-size:9px;fill:var(--teal)">
    <text x="102" y="125">acc₁</text>
    <text x="192" y="125">acc₂</text>
    <text x="282" y="125">acc₃</text>
    <text x="372" y="125">acc₄</text>
  </g>

  <!-- the new frame drops in -->
  <g class="arrow" stroke-width="1.2">
    <path d="M102 52 V 101"/><path d="M192 52 V 101"/><path d="M282 52 V 101"/><path d="M372 52 V 101"/>
  </g>
  <g class="arrowhead">
    <path d="M102 108 l -4 -7 h 8 z"/><path d="M192 108 l -4 -7 h 8 z"/>
    <path d="M282 108 l -4 -7 h 8 z"/><path d="M372 108 l -4 -7 h 8 z"/>
  </g>
  <g class="lbl" style="font-size:9px">
    <text x="108" y="84">× 1</text>
    <text x="198" y="84">× 1/2</text>
    <text x="288" y="84">× 1/3</text>
    <text x="378" y="84">× 1/4</text>
  </g>

  <!-- and the average carries forward -->
  <g fill="none" stroke="var(--pink)" stroke-width="1.5">
    <path d="M134 121 H 152"/><path d="M224 121 H 242"/><path d="M314 121 H 332"/>
  </g>
  <g fill="var(--pink)">
    <path d="M159 121 l -7 -4 v 8 z"/><path d="M249 121 l -7 -4 v 8 z"/><path d="M339 121 l -7 -4 v 8 z"/>
  </g>
  <g class="lbl" text-anchor="middle" style="font-size:9px">
    <text x="147" y="150">× 1/2</text>
    <text x="237" y="150">× 2/3</text>
    <text x="327" y="150">× 3/4</text>
  </g>

  <path d="M10 170 H 30" fill="none" stroke="var(--pink)" stroke-width="1.5"/>
  <text x="36" y="174" class="lbl">the buffer that outlives the frame — a fresh texture every pass</text>
</svg>
