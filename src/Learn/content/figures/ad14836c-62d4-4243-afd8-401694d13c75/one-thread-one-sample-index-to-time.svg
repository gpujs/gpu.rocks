<svg viewBox="0 0 440 140" role="img" aria-label="A row of sample-index chips above the time each one stands for: dividing the index by the sample rate of 256 turns sample 64 into a quarter of a second, while using the index straight as the time runs every tone 256 times too fast.">
  <text x="10" y="13" class="lbl-up">SAMPLE INDEX IS NOT TIME</text>

  <g fill="none" stroke="var(--line)">
    <rect x="24" y="24" width="34" height="22" rx="5"/>
    <rect x="74" y="24" width="34" height="22" rx="5"/>
    <rect x="124" y="24" width="34" height="22" rx="5"/>
    <rect x="268" y="24" width="34" height="22" rx="5"/>
  </g>
  <rect x="196" y="24" width="34" height="22" rx="5" fill="none" stroke="var(--pink)" stroke-width="1.7"/>
  <g text-anchor="middle" style="font-size:10px">
    <text x="41" y="39" class="lbl" style="font-size:10px">0</text>
    <text x="91" y="39" class="lbl" style="font-size:10px">1</text>
    <text x="141" y="39" class="lbl" style="font-size:10px">2</text>
    <text x="213" y="39" fill="var(--pink)">64</text>
    <text x="285" y="39" class="lbl" style="font-size:10px">255</text>
  </g>
  <text x="170" y="39" class="lbl">…</text>
  <text x="245" y="39" class="lbl">…</text>
  <text x="312" y="39" class="lbl">i = this.thread.x</text>

  <path class="arrow" d="M213 48 V 62" stroke="var(--pink)" stroke-width="1.4"/>
  <path d="M213 68 l -4 -7 h 8 z" fill="var(--pink)"/>
  <text x="222" y="61" style="font-size:10px" fill="var(--pink)">÷ 256</text>

  <line x1="24" y1="74" x2="404" y2="74" class="cellline"/>
  <g stroke="var(--teal)" stroke-width="1.3">
    <line x1="41" y1="70" x2="41" y2="78"/>
    <line x1="91" y1="70" x2="91" y2="78"/>
    <line x1="141" y1="70" x2="141" y2="78"/>
    <line x1="213" y1="68" x2="213" y2="80"/>
    <line x1="285" y1="70" x2="285" y2="78"/>
  </g>
  <g text-anchor="middle" style="font-size:9px" fill="var(--teal)">
    <text x="41" y="92">0</text>
    <text x="91" y="92">1/256</text>
    <text x="141" y="92">2/256</text>
    <text x="213" y="92">0.25 s</text>
    <text x="285" y="92">0.996 s</text>
  </g>
  <text x="312" y="92" class="lbl" style="font-size:9px">t, in seconds</text>

  <text x="24" y="120" class="formula">t = this.thread.x / this.constants.sampleRate</text>
  <text x="24" y="134" style="font-size:10px" fill="var(--lred)">t = this.thread.x → every tone 256× too fast</text>
</svg>
