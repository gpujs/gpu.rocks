<svg viewBox="0 0 440 200" role="img" aria-label="The work each transform does at n equals 8,192. The naive DFT is one pass over an 8,192 by 8,192 grid of terms, drawn as a filled square: 67,108,864 complex multiplies. The radix-2 FFT is thirteen passes of 4,096 butterflies, drawn as thirteen thin bars: 53,248 complex multiplies, 1,260 times less. A short table shows the ratio growing with n: 114 times at 512, 1,260 times at 8,192 and 8,192 times at 65,536.">
  <text x="10" y="14" class="lbl-up">WHAT EACH ONE COSTS AT n = 8,192</text>

  <!-- the naive DFT: one dense pass, n by n -->
  <rect x="20" y="32" width="96" height="96" rx="3" fill="var(--amber)" fill-opacity=".16" stroke="var(--amber)" stroke-width="1.4"/>
  <g stroke="var(--amber)" stroke-opacity=".35">
    <path d="M32 32 V 128"/><path d="M44 32 V 128"/><path d="M56 32 V 128"/><path d="M68 32 V 128"/>
    <path d="M80 32 V 128"/><path d="M92 32 V 128"/><path d="M104 32 V 128"/>
    <path d="M20 44 H 116"/><path d="M20 56 H 116"/><path d="M20 68 H 116"/><path d="M20 80 H 116"/>
    <path d="M20 92 H 116"/><path d="M20 104 H 116"/><path d="M20 116 H 116"/>
  </g>
  <text x="68" y="146" text-anchor="middle" style="font-size:10px" fill="var(--amber)">naive DFT</text>
  <text x="68" y="160" text-anchor="middle" class="lbl">one pass, 8,192 × 8,192</text>
  <text x="68" y="176" text-anchor="middle" class="formula">67,108,864</text>

  <!-- the FFT: thirteen thin passes -->
  <g fill="var(--teal)" fill-opacity=".18" stroke="var(--teal)" stroke-width="1.1">
    <rect x="186" y="32" width="96" height="5" rx="1.8"/>
    <rect x="186" y="39.4" width="96" height="5" rx="1.8"/>
    <rect x="186" y="46.8" width="96" height="5" rx="1.8"/>
    <rect x="186" y="54.2" width="96" height="5" rx="1.8"/>
    <rect x="186" y="61.6" width="96" height="5" rx="1.8"/>
    <rect x="186" y="69" width="96" height="5" rx="1.8"/>
    <rect x="186" y="76.4" width="96" height="5" rx="1.8"/>
    <rect x="186" y="83.8" width="96" height="5" rx="1.8"/>
    <rect x="186" y="91.2" width="96" height="5" rx="1.8"/>
    <rect x="186" y="98.6" width="96" height="5" rx="1.8"/>
    <rect x="186" y="106" width="96" height="5" rx="1.8"/>
    <rect x="186" y="113.4" width="96" height="5" rx="1.8"/>
    <rect x="186" y="120.8" width="96" height="5" rx="1.8"/>
  </g>
  <text x="234" y="146" text-anchor="middle" style="font-size:10px" fill="var(--teal)">radix-2 FFT</text>
  <text x="234" y="160" text-anchor="middle" class="lbl">thirteen passes, 4,096 each</text>
  <text x="234" y="176" text-anchor="middle" class="formula">53,248</text>

  <!-- the ratio between them -->
  <path d="M124 80 H 178" stroke="var(--muted)" stroke-width="1"/>
  <path d="M178 80 l -7 -3.5 v 7 z" fill="var(--muted)"/>
  <text x="151" y="74" text-anchor="middle" class="lbl">1,260×</text>

  <!-- and it keeps growing -->
  <path d="M300 32 V 128" stroke="var(--line)" stroke-dasharray="3 4"/>
  <text x="312" y="42" class="lbl">and the gap widens</text>
  <g style="font-size:10px">
    <text x="312" y="66">n = 512</text><text x="430" y="66" text-anchor="end" fill="var(--teal)">114×</text>
    <text x="312" y="88">n = 8,192</text><text x="430" y="88" text-anchor="end" fill="var(--teal)">1,260×</text>
    <text x="312" y="110">n = 65,536</text><text x="430" y="110" text-anchor="end" fill="var(--teal)">8,192×</text>
  </g>
  <text x="312" y="128" class="lbl">complex multiplies,</text>
  <text x="312" y="140" class="lbl">DFT ÷ FFT</text>
</svg>
