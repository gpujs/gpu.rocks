  <path d="M62 56 L66.5 56.3 71 57.2 75.5 58.9 80 61.1 84.5 62.9 89 64 93.5 64.5 98 65.2 102.5 67 107 70.3 111.5 74.4 116 77.7 120.5 78.2 125 74.5 129.5 66.6 134 56 138.5 45.5 143 37.7 147.5 34.1 152 34.7 156.5 38 161 42.2 165.5 45.4 170 47.2 174.5 47.9 179 48.4 183.5 49.4 188 51.2 192.5 53.3 197 54.9 201.5 55.8 206 56 210.5 56.2 215 57.1 219.5 58.7 224 60.7 228.5 62.4 233 63.4 237.5 63.9 242 64.5 246.5 66.1 251 69.2 255.5 73 260 76.1 264.5 76.5 269 73.1 273.5 65.7 278 56 282.5 46.3 287 39.1 291.5 35.8 296 36.3 300.5 39.4 305 43.2 309.5 46.2 314 47.9 318.5 48.5 323 48.9 327.5 49.9 332 51.6 336.5 53.5 341 55 345.5 55.8 350 56"
