<svg viewBox="0 0 440 158" role="img" aria-label="output [6] launches a line of threads whose result is a flat row indexed result[x]; output [4, 4] launches a grid whose result is rows of rows — the multiplication-table cell at x 3, y 1 comes back as result[1][3] = 8.">
  <!-- left: a 1D shape -->
  <text x="10" y="14" class="lbl-up">OUTPUT: [6]</text>
  <g fill="none" stroke="var(--line)">
    <rect x="10" y="34" width="28" height="22" rx="4"/><rect x="42" y="34" width="28" height="22" rx="4"/><rect x="74" y="34" width="28" height="22" rx="4"/>
    <rect x="106" y="34" width="28" height="22" rx="4"/><rect x="138" y="34" width="28" height="22" rx="4"/><rect x="170" y="34" width="28" height="22" rx="4"/>
  </g>
  <g style="font-size:10px" text-anchor="middle">
    <text x="24" y="49">1</text><text x="56" y="49">2</text><text x="88" y="49">3</text><text x="120" y="49">4</text><text x="152" y="49">5</text><text x="184" y="49">6</text>
  </g>
  <path class="arrow" d="M10 72 H 190" stroke-width="1.2"/>
  <path class="arrowhead" d="M196 72 l -7 -4 v 8 z"/>
  <text x="10" y="90" class="lbl">this.thread.x → 0 … 5</text>
  <text x="10" y="108" class="lbl">one flat row: result[x]</text>

  <line x1="214" y1="18" x2="214" y2="140" class="cellline"/>

  <!-- right: a 2D shape (the multiplication table) -->
  <text x="228" y="14" class="lbl-up">OUTPUT: [4, 4]</text>
  <g style="font-size:8px" text-anchor="middle">
    <text x="256" y="32" class="lbl" style="font-size:8px">0</text><text x="280" y="32" class="lbl" style="font-size:8px">1</text><text x="304" y="32" class="lbl" style="font-size:8px">2</text><text x="328" y="32" class="lbl" style="font-size:8px">3</text>
  </g>
  <g text-anchor="end">
    <text x="240" y="50" class="lbl" style="font-size:8px">0</text><text x="240" y="74" class="lbl" style="font-size:8px">1</text><text x="240" y="98" class="lbl" style="font-size:8px">2</text><text x="240" y="122" class="lbl" style="font-size:8px">3</text>
  </g>
  <g fill="none" stroke="var(--line)">
    <rect x="246" y="36" width="20" height="20" rx="4"/><rect x="270" y="36" width="20" height="20" rx="4"/><rect x="294" y="36" width="20" height="20" rx="4"/><rect x="318" y="36" width="20" height="20" rx="4"/>
    <rect x="246" y="60" width="20" height="20" rx="4"/><rect x="270" y="60" width="20" height="20" rx="4"/><rect x="294" y="60" width="20" height="20" rx="4"/><rect x="318" y="60" width="20" height="20" rx="4"/>
    <rect x="246" y="84" width="20" height="20" rx="4"/><rect x="270" y="84" width="20" height="20" rx="4"/><rect x="294" y="84" width="20" height="20" rx="4"/><rect x="318" y="84" width="20" height="20" rx="4"/>
    <rect x="246" y="108" width="20" height="20" rx="4"/><rect x="270" y="108" width="20" height="20" rx="4"/><rect x="294" y="108" width="20" height="20" rx="4"/><rect x="318" y="108" width="20" height="20" rx="4"/>
  </g>
  <g style="font-size:9px" text-anchor="middle">
    <text x="256" y="50">1</text><text x="280" y="50">2</text><text x="304" y="50">3</text><text x="328" y="50">4</text>
    <text x="256" y="74">2</text><text x="280" y="74">4</text><text x="304" y="74">6</text><text x="328" y="74">8</text>
    <text x="256" y="98">3</text><text x="280" y="98">6</text><text x="304" y="98">9</text><text x="328" y="98">12</text>
    <text x="256" y="122">4</text><text x="280" y="122">8</text><text x="304" y="122">12</text><text x="328" y="122">16</text>
  </g>

  <!-- this one, follow it -->
  <rect x="318" y="60" width="20" height="20" rx="4" fill="none" stroke="var(--pink)" stroke-width="2"/>
  <path class="arrow" d="M342 70 H 348" stroke-width="1.2"/>
  <path class="arrowhead" d="M354 70 l -7 -4 v 8 z"/>
  <text x="360" y="66" class="formula">result[1][3]</text>
  <text x="360" y="82" class="formula">= 8</text>

  <text x="228" y="152" class="lbl">rows of rows: result[y][x]</text>
</svg>
