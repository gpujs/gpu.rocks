<svg viewBox="0 0 440 150" role="img" aria-label="One Gray–Scott step: the stepU and stepV kernels each read both old grids U and V from the same snapshot, and write the new grids U-prime and V-prime.">
  <text x="10" y="14" class="lbl-up">ONE GRAY–SCOTT STEP</text>

  <!-- old snapshot -->
  <rect x="16" y="26" width="92" height="106" rx="10" fill="none" stroke="var(--line)"/>
  <text x="62" y="40" text-anchor="middle" class="lbl">old snapshot</text>
  <rect x="28" y="48" width="68" height="32" rx="6" fill="none" stroke="var(--line)"/>
  <text x="62" y="62" text-anchor="middle" class="formula">U</text>
  <text x="62" y="74" text-anchor="middle" class="lbl">food</text>
  <rect x="28" y="90" width="68" height="32" rx="6" fill="none" stroke="var(--line)"/>
  <text x="62" y="104" text-anchor="middle" class="formula">V</text>
  <text x="62" y="116" text-anchor="middle" class="lbl">eater</text>

  <!-- both kernels read both grids -->
  <path class="arrow" d="M112 56 H 158" stroke-width="1.4"/>
  <path class="arrowhead" d="M164 56 l -7 -4 v 8 z"/>
  <path class="arrow" d="M112 66 L 156 101" stroke-width="1.4"/>
  <path class="arrowhead" d="M0 0 l -7 -4 v 8 z" transform="translate(162 106) rotate(38)"/>
  <path class="arrow" d="M112 98 L 156 65" stroke-width="1.4"/>
  <path class="arrowhead" d="M0 0 l -7 -4 v 8 z" transform="translate(162 61) rotate(-37)"/>
  <path class="arrow" d="M112 108 H 158" stroke-width="1.4"/>
  <path class="arrowhead" d="M164 108 l -7 -4 v 8 z"/>

  <rect x="170" y="40" width="100" height="40" rx="8" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
  <text x="220" y="56" text-anchor="middle" style="font-size:10px" fill="var(--blue)">stepU</text>
  <text x="220" y="71" text-anchor="middle" class="lbl">du·∇²u − u·v²</text>
  <rect x="170" y="92" width="100" height="40" rx="8" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
  <text x="220" y="108" text-anchor="middle" style="font-size:10px" fill="var(--blue)">stepV</text>
  <text x="220" y="123" text-anchor="middle" class="lbl">dv·∇²v + u·v²</text>

  <!-- new grids -->
  <path class="arrow" d="M274 60 H 306" stroke-width="1.4"/>
  <path class="arrowhead" d="M312 60 l -7 -4 v 8 z"/>
  <rect x="318" y="44" width="54" height="32" rx="6" fill="none" stroke="var(--teal)" stroke-width="1.6"/>
  <text x="345" y="64" text-anchor="middle" style="font-size:10px" fill="var(--teal)">U′</text>
  <path class="arrow" d="M274 112 H 306" stroke-width="1.4"/>
  <path class="arrowhead" d="M312 112 l -7 -4 v 8 z"/>
  <rect x="318" y="96" width="54" height="32" rx="6" fill="none" stroke="var(--teal)" stroke-width="1.6"/>
  <text x="345" y="116" text-anchor="middle" style="font-size:10px" fill="var(--teal)">V′</text>

  <text x="220" y="146" text-anchor="middle" class="lbl">u·v² couples them — both kernels read both grids</text>
</svg>
