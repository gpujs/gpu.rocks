<svg viewBox="0 0 320 176" role="img" aria-label="Two panels. On the left, forbidden: one input cell fans three red arrows out into three different output slots, writing wherever its offset says. On the right, allowed: one output slot pulls a single teal arrow in from the input whose offset matches its own index, after looking at the others.">
  <text x="10" y="14" class="lbl-up">PUSH VS PULL</text>

  <!-- forbidden: one element choosing three destinations -->
  <g>
    <g fill="none" stroke="var(--line)">
      <rect x="20" y="30" width="26" height="18" rx="3"/>
      <rect x="82" y="30" width="26" height="18" rx="3"/>
      <rect x="113" y="30" width="26" height="18" rx="3"/>
    </g>
    <rect x="51" y="30" width="26" height="18" rx="3" fill="none" stroke="var(--lred)" stroke-width="1.6"/>
    <g fill="none" stroke="var(--lred)" stroke-width="1.3" opacity=".85">
      <path d="M60 50 C 60 70, 33 74, 33 92"/>
      <path d="M64 50 V 92"/>
      <path d="M70 50 C 70 70, 95 74, 95 92"/>
    </g>
    <g fill="var(--lred)">
      <path d="M33 98 l -4 -7 h 8 z"/>
      <path d="M64 98 l -4 -7 h 8 z"/>
      <path d="M95 98 l -4 -7 h 8 z"/>
    </g>
    <g fill="none" stroke="var(--line)">
      <rect x="20" y="98" width="26" height="18" rx="3"/>
      <rect x="51" y="98" width="26" height="18" rx="3"/>
      <rect x="82" y="98" width="26" height="18" rx="3"/>
      <rect x="113" y="98" width="26" height="18" rx="3"/>
    </g>
    <text x="79" y="137" text-anchor="middle" style="font-size:10px;fill:var(--lred)">✗ scatter</text>
    <text x="79" y="152" text-anchor="middle" class="lbl">out[offsets[i]] = v</text>
    <text x="79" y="166" text-anchor="middle" class="lbl">writes another cell</text>
  </g>

  <line x1="160" y1="26" x2="160" y2="158" class="cellline"/>

  <!-- allowed: one output slot choosing what to read -->
  <g>
    <g fill="none" stroke="var(--line)">
      <rect x="181" y="30" width="26" height="18" rx="3"/>
      <rect x="243" y="30" width="26" height="18" rx="3"/>
      <rect x="274" y="30" width="26" height="18" rx="3"/>
    </g>
    <rect x="212" y="30" width="26" height="18" rx="3" fill="none" stroke="var(--teal)" stroke-width="1.6"/>
    <g fill="none" stroke="var(--muted)" stroke-width="1.1" stroke-dasharray="3 3" opacity=".7">
      <path d="M194 50 C 194 70, 219 74, 219 90"/>
      <path d="M256 50 C 256 70, 231 74, 231 90"/>
    </g>
    <path d="M225 50 V 90" fill="none" stroke="var(--teal)" stroke-width="1.5"/>
    <path d="M225 98 l -4 -8 h 8 z" fill="var(--teal)"/>
    <g fill="none" stroke="var(--line)">
      <rect x="181" y="98" width="26" height="18" rx="3"/>
      <rect x="243" y="98" width="26" height="18" rx="3"/>
      <rect x="274" y="98" width="26" height="18" rx="3"/>
    </g>
    <rect x="212" y="98" width="26" height="18" rx="3" fill="var(--teal)" fill-opacity=".18" stroke="var(--teal)" stroke-width="1.6"/>
    <text x="241" y="137" text-anchor="middle" style="font-size:10px;fill:var(--teal)">✓ gather</text>
    <text x="241" y="152" text-anchor="middle" class="lbl">offsets[i] === j ?</text>
    <text x="241" y="166" text-anchor="middle" class="lbl">reads another cell</text>
  </g>
</svg>
