<svg viewBox="0 0 440 212" role="img" aria-label="A six by four grid of cumulative costs. The cheapest cell of the bottom row, holding eight, is where the walk starts. From it the path steps upwards to the cheapest of the three cells it could have come from — only those three are candidates — and repeats until it reaches the top row. The four cells on the path are highlighted.">
  <text x="10" y="14" class="lbl-up">WALK BACK UP THE COST MAP</text>

  <!-- row 0 -->
  <g fill="none" stroke="var(--line)">
    <rect x="30" y="28" width="40" height="22" rx="4"/>
    <rect x="118" y="28" width="40" height="22" rx="4"/>
    <rect x="162" y="28" width="40" height="22" rx="4"/>
    <rect x="206" y="28" width="40" height="22" rx="4"/>
    <rect x="250" y="28" width="40" height="22" rx="4"/>
  </g>
  <rect x="74" y="28" width="40" height="22" rx="4" fill="var(--pink)" fill-opacity=".16" stroke="var(--pink)" stroke-width="1.6"/>
  <g text-anchor="middle" style="font-size:10px">
    <text x="50" y="43" fill="var(--muted)">5</text>
    <text x="94" y="43" fill="var(--pink)">3</text>
    <text x="138" y="43" fill="var(--muted)">6</text>
    <text x="182" y="43" fill="var(--muted)">8</text>
    <text x="226" y="43" fill="var(--muted)">4</text>
    <text x="270" y="43" fill="var(--muted)">7</text>
  </g>
  <text x="300" y="43" class="lbl">row 0</text>

  <!-- row 1 -->
  <g fill="none" stroke="var(--line)">
    <rect x="74" y="66" width="40" height="22" rx="4"/>
    <rect x="118" y="66" width="40" height="22" rx="4"/>
    <rect x="162" y="66" width="40" height="22" rx="4"/>
    <rect x="206" y="66" width="40" height="22" rx="4"/>
    <rect x="250" y="66" width="40" height="22" rx="4"/>
  </g>
  <rect x="30" y="66" width="40" height="22" rx="4" fill="var(--pink)" fill-opacity=".16" stroke="var(--pink)" stroke-width="1.6"/>
  <g text-anchor="middle" style="font-size:10px">
    <text x="50" y="81" fill="var(--pink)">5</text>
    <text x="94" y="81" fill="var(--muted)">12</text>
    <text x="138" y="81" fill="var(--muted)">7</text>
    <text x="182" y="81" fill="var(--muted)">5</text>
    <text x="226" y="81" fill="var(--muted)">12</text>
    <text x="270" y="81" fill="var(--muted)">7</text>
  </g>

  <!-- row 2, with the window of three that decided the step into it -->
  <g fill="none" stroke="var(--line)">
    <rect x="30" y="104" width="40" height="22" rx="4"/>
    <rect x="206" y="104" width="40" height="22" rx="4"/>
    <rect x="250" y="104" width="40" height="22" rx="4"/>
  </g>
  <g fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="3 3">
    <rect x="118" y="104" width="40" height="22" rx="4"/>
    <rect x="162" y="104" width="40" height="22" rx="4"/>
  </g>
  <rect x="74" y="104" width="40" height="22" rx="4" fill="var(--pink)" fill-opacity=".16" stroke="var(--pink)" stroke-width="1.6"/>
  <g text-anchor="middle" style="font-size:10px">
    <text x="50" y="119" fill="var(--muted)">12</text>
    <text x="94" y="119" fill="var(--pink)">7</text>
    <text x="138" y="119" fill="var(--muted)">11</text>
    <text x="182" y="119" fill="var(--muted)">10</text>
    <text x="226" y="119" fill="var(--muted)">7</text>
    <text x="270" y="119" fill="var(--muted)">16</text>
  </g>
  <text x="300" y="119" class="lbl">only these three</text>

  <!-- row 3: the only row holding finished prices -->
  <g fill="none" stroke="var(--line)">
    <rect x="30" y="142" width="40" height="22" rx="4"/>
    <rect x="74" y="142" width="40" height="22" rx="4"/>
    <rect x="162" y="142" width="40" height="22" rx="4"/>
    <rect x="206" y="142" width="40" height="22" rx="4"/>
    <rect x="250" y="142" width="40" height="22" rx="4"/>
  </g>
  <rect x="118" y="142" width="40" height="22" rx="4" fill="var(--teal)" fill-opacity=".2" stroke="var(--teal)" stroke-width="1.8"/>
  <g text-anchor="middle" style="font-size:10px">
    <text x="50" y="157" fill="var(--muted)">11</text>
    <text x="94" y="157" fill="var(--muted)">15</text>
    <text x="138" y="157" fill="var(--teal)">8</text>
    <text x="182" y="157" fill="var(--muted)">13</text>
    <text x="226" y="157" fill="var(--muted)">14</text>
    <text x="270" y="157" fill="var(--muted)">9</text>
  </g>
  <text x="300" y="152" style="font-size:10px" fill="var(--teal)">cheapest ending</text>
  <text x="300" y="165" class="lbl">start the walk here</text>

  <!-- the walk: three steps, each into the cheapest of the three above -->
  <g fill="none" stroke="var(--pink)" stroke-width="1.5">
    <path d="M138 142 L 98 128"/>
    <path d="M94 104 L 54 90"/>
    <path d="M50 66 L 90 52"/>
  </g>
  <g fill="var(--pink)">
    <path d="M94 126 l -1 8 l 7 -5 z"/>
    <path d="M50 88 l -1 8 l 7 -5 z"/>
    <path d="M94 50 l -7 5 l 1 -8 z"/>
  </g>

  <text x="220" y="196" text-anchor="middle" class="formula">three steps, three numbers each — this one stays on the host</text>
</svg>
