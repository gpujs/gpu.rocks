<svg viewBox="0 0 440 150" role="img" aria-label="A row of eight cells holding an alternating plus one, minus one checkerboard, shown at three successive steps with alpha equal to 0.4. The amplitude goes from one to minus 2.2 to plus 4.8: the sign flips and the size grows by a factor of 2.2 every step.">
  <text x="10" y="14" class="lbl-up">α = 0.4 — THE CHECKERBOARD GROWS</text>

  <!-- step 0: the checkerboard as it starts -->
  <g fill="none" stroke="var(--line)">
    <rect x="20" y="26" width="32" height="22" rx="3"/><rect x="52" y="26" width="32" height="22" rx="3"/><rect x="84" y="26" width="32" height="22" rx="3"/><rect x="116" y="26" width="32" height="22" rx="3"/>
    <rect x="148" y="26" width="32" height="22" rx="3"/><rect x="180" y="26" width="32" height="22" rx="3"/><rect x="212" y="26" width="32" height="22" rx="3"/><rect x="244" y="26" width="32" height="22" rx="3"/>
  </g>
  <g text-anchor="middle" style="font-size:9px">
    <text x="36" y="41">+1</text><text x="68" y="41">−1</text><text x="100" y="41">+1</text><text x="132" y="41">−1</text>
    <text x="164" y="41">+1</text><text x="196" y="41">−1</text><text x="228" y="41">+1</text><text x="260" y="41">−1</text>
  </g>
  <text x="356" y="41" text-anchor="middle" class="lbl">step 0</text>

  <path class="arrow" d="M288 50 V 58" stroke-width="1.3"/>
  <path class="arrowhead" d="M288 64 l -4 -7 h 8 z"/>

  <!-- step 1: flipped, and 2.2 times bigger -->
  <g fill="none" stroke="var(--lred)" stroke-width="1.3">
    <rect x="20" y="64" width="32" height="22" rx="3"/><rect x="52" y="64" width="32" height="22" rx="3"/><rect x="84" y="64" width="32" height="22" rx="3"/><rect x="116" y="64" width="32" height="22" rx="3"/>
    <rect x="148" y="64" width="32" height="22" rx="3"/><rect x="180" y="64" width="32" height="22" rx="3"/><rect x="212" y="64" width="32" height="22" rx="3"/><rect x="244" y="64" width="32" height="22" rx="3"/>
  </g>
  <g text-anchor="middle" style="font-size:9px" fill="var(--lred)">
    <text x="36" y="79">−2.2</text><text x="68" y="79">+2.2</text><text x="100" y="79">−2.2</text><text x="132" y="79">+2.2</text>
    <text x="164" y="79">−2.2</text><text x="196" y="79">+2.2</text><text x="228" y="79">−2.2</text><text x="260" y="79">+2.2</text>
  </g>
  <text x="356" y="79" text-anchor="middle" class="lbl">step 1</text>

  <path class="arrow" d="M288 88 V 96" stroke-width="1.3"/>
  <path class="arrowhead" d="M288 102 l -4 -7 h 8 z"/>

  <!-- step 2 -->
  <g fill="none" stroke="var(--lred)" stroke-width="1.6">
    <rect x="20" y="102" width="32" height="22" rx="3"/><rect x="52" y="102" width="32" height="22" rx="3"/><rect x="84" y="102" width="32" height="22" rx="3"/><rect x="116" y="102" width="32" height="22" rx="3"/>
    <rect x="148" y="102" width="32" height="22" rx="3"/><rect x="180" y="102" width="32" height="22" rx="3"/><rect x="212" y="102" width="32" height="22" rx="3"/><rect x="244" y="102" width="32" height="22" rx="3"/>
  </g>
  <g text-anchor="middle" style="font-size:9px" fill="var(--lred)">
    <text x="36" y="117">+4.8</text><text x="68" y="117">−4.8</text><text x="100" y="117">+4.8</text><text x="132" y="117">−4.8</text>
    <text x="164" y="117">+4.8</text><text x="196" y="117">−4.8</text><text x="228" y="117">+4.8</text><text x="260" y="117">−4.8</text>
  </g>
  <text x="356" y="117" text-anchor="middle" class="lbl">step 2</text>

  <text x="356" y="60" text-anchor="middle" class="formula">× (1 − 8α)</text>
  <text x="356" y="98" text-anchor="middle" class="formula">= −2.2</text>

  <text x="20" y="142" class="lbl">80 steps of this is a factor of 10²⁷</text>
</svg>
