  <text x="220" y="224" text-anchor="middle" class="formula">frame f covers signal[f · hop … f · hop + win − 1]</text>
  <text x="220" y="237" text-anchor="middle" class="lbl">64 frames × 128 bins = 8,192 independent threads</text>
