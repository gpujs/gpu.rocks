<svg viewBox="0 0 440 148" role="img" aria-label="Two passes over the same four numbers, both sorting by the tens digit. The stable pass keeps 21 ahead of 27, which tie on that digit; the unstable pass swaps them, and their arrows cross.">
  <text x="10" y="13" class="lbl-up">SORTING BY THE TENS DIGIT</text>

  <line x1="216" y1="22" x2="216" y2="132" class="cellline"/>

  <!-- ============ left panel: a stable pass ============ -->
  <text x="107" y="30" text-anchor="middle" class="lbl">stable</text>
  <g text-anchor="middle">
    <text x="38" y="44" class="lbl">2</text><text x="84" y="44" class="lbl">1</text><text x="130" y="44" class="lbl">3</text><text x="176" y="44" class="lbl">2</text>
  </g>
  <g fill="none" stroke="var(--line)">
    <rect x="64" y="48" width="40" height="22" rx="4"/>
    <rect x="110" y="48" width="40" height="22" rx="4"/>
  </g>
  <g fill="none" stroke="var(--pink)" stroke-width="1.6">
    <rect x="18" y="48" width="40" height="22" rx="4"/>
    <rect x="156" y="48" width="40" height="22" rx="4"/>
  </g>
  <g style="font-size:10px" text-anchor="middle">
    <text x="38" y="63">21</text><text x="84" y="63">13</text><text x="130" y="63">34</text><text x="176" y="63">27</text>
  </g>

  <g class="arrow" stroke-width="1.1" opacity=".5">
    <path d="M84 74 L 38 97"/><path d="M130 74 L 176 97"/>
  </g>
  <g fill="none" stroke="var(--pink)" stroke-width="1.3">
    <path d="M38 74 L 84 97"/><path d="M176 74 L 130 97"/>
  </g>
  <g fill="var(--muted)" opacity=".6">
    <path d="M38 104 L 34 97 h 8 z"/><path d="M176 104 L 172 97 h 8 z"/>
  </g>
  <g fill="var(--pink)">
    <path d="M84 104 L 80 97 h 8 z"/><path d="M130 104 L 126 97 h 8 z"/>
  </g>

  <g fill="none" stroke="var(--line)">
    <rect x="18" y="104" width="40" height="22" rx="4"/>
    <rect x="156" y="104" width="40" height="22" rx="4"/>
  </g>
  <g fill="none" stroke="var(--pink)" stroke-width="1.6">
    <rect x="64" y="104" width="40" height="22" rx="4"/>
    <rect x="110" y="104" width="40" height="22" rx="4"/>
  </g>
  <g style="font-size:10px" text-anchor="middle">
    <text x="38" y="119">13</text><text x="84" y="119">21</text><text x="130" y="119">27</text><text x="176" y="119">34</text>
  </g>
  <path d="M18 131 H 196" stroke="var(--teal)" stroke-width="2" fill="none"/>
  <text x="107" y="144" text-anchor="middle" style="font-size:10px" fill="var(--teal)">✓ 21 still ahead of 27</text>

  <!-- ============ right panel: an unstable pass ============ -->
  <text x="325" y="30" text-anchor="middle" class="lbl">unstable</text>
  <g text-anchor="middle">
    <text x="256" y="44" class="lbl">2</text><text x="302" y="44" class="lbl">1</text><text x="348" y="44" class="lbl">3</text><text x="394" y="44" class="lbl">2</text>
  </g>
  <g fill="none" stroke="var(--line)">
    <rect x="282" y="48" width="40" height="22" rx="4"/>
    <rect x="328" y="48" width="40" height="22" rx="4"/>
  </g>
  <g fill="none" stroke="var(--pink)" stroke-width="1.6">
    <rect x="236" y="48" width="40" height="22" rx="4"/>
    <rect x="374" y="48" width="40" height="22" rx="4"/>
  </g>
  <g style="font-size:10px" text-anchor="middle">
    <text x="256" y="63">21</text><text x="302" y="63">13</text><text x="348" y="63">34</text><text x="394" y="63">27</text>
  </g>

  <g class="arrow" stroke-width="1.1" opacity=".5">
    <path d="M302 74 L 256 97"/><path d="M348 74 L 394 97"/>
  </g>
  <g fill="none" stroke="var(--pink)" stroke-width="1.3">
    <path d="M256 74 L 348 97"/><path d="M394 74 L 302 97"/>
  </g>
  <g fill="var(--muted)" opacity=".6">
    <path d="M256 104 L 252 97 h 8 z"/><path d="M394 104 L 390 97 h 8 z"/>
  </g>
  <g fill="var(--pink)">
    <path d="M348 104 L 344 97 h 8 z"/><path d="M302 104 L 298 97 h 8 z"/>
  </g>

  <g fill="none" stroke="var(--line)">
    <rect x="236" y="104" width="40" height="22" rx="4"/>
    <rect x="374" y="104" width="40" height="22" rx="4"/>
  </g>
  <g fill="none" stroke="var(--pink)" stroke-width="1.6">
    <rect x="282" y="104" width="40" height="22" rx="4"/>
    <rect x="328" y="104" width="40" height="22" rx="4"/>
  </g>
  <g style="font-size:10px" text-anchor="middle">
    <text x="256" y="119">13</text><text x="302" y="119">27</text><text x="348" y="119">21</text><text x="394" y="119">34</text>
  </g>
  <path d="M236 131 H 414" stroke="var(--lred)" stroke-width="2" fill="none"/>
  <text x="325" y="144" text-anchor="middle" style="font-size:10px" fill="var(--lred)">✗ 27 jumped ahead of 21</text>
</svg>
