<svg viewBox="0 0 440 204" role="img" aria-label="Anti-diagonal 12 of a nine by ten score matrix, highlighted, and the same six cells unrolled into a row of six threads. Thread zero owns the cell at row iStart; each later thread moves one row down and one column left. Two dashed cells outside the matrix show where the diagonal would continue if the second sequence were longer, which is why iStart is the larger of one and d minus the length of B.">
