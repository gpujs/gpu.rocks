<svg viewBox="0 0 440 196" role="img" aria-label="A brightness profile along one diagonal line of an unevenly lit scene. The background steps steadily downwards from left to right and six bright marks stand on top of it. A flat dashed line marks a single global threshold: to the left of the picture the background alone already rises above it, so everything is called foreground; in the middle only the marks rise above it, which is the only place the threshold works; at the right not even the marks reach it, so nothing is found. A second, sloping line shows the local neighbourhood mean plus a small bias, which tracks the falling background so that every mark stands above it and no background does.">
  <text x="10" y="14" class="lbl-up">ONE LINE ACROSS A LIT SCENE</text>

  <g stroke-width="1.4" fill="none">
    <path d="M250 14 H272" stroke="var(--lred)" stroke-dasharray="4 3"/>
    <path d="M250 26 H272" stroke="var(--teal)"/>
  </g>
  <text x="278" y="17" style="font-size:9px" fill="var(--lred)">one global number</text>
  <text x="278" y="29" style="font-size:9px" fill="var(--teal)">mean of the 9x9 + c</text>

  <!-- the marks: small, bright, standing on whatever ground they land on -->
  <g fill="var(--blue)" fill-opacity=".35" stroke="var(--blue)" stroke-width="1"><rect x="49" y="40" width="12" height="22" rx="1.5"/><rect x="109" y="55" width="12" height="22" rx="1.5"/><rect x="169" y="70" width="12" height="22" rx="1.5"/><rect x="229" y="85" width="12" height="22" rx="1.5"/><rect x="289" y="100" width="12" height="22" rx="1.5"/><rect x="349" y="115" width="12" height="22" rx="1.5"/></g>

  <!-- background brightness, falling in lighting bands -->
  <path d="M 40 62 H 70 V 69.5 H 100 V 77 H 130 V 84.5 H 160 V 92 H 190 V 99.5 H 220 V 107 H 250 V 114.5 H 280 V 122 H 310 V 129.5 H 340 V 137 H 370 V 144.5 H 400" fill="none" stroke="var(--ink)" stroke-width="1.4"/>

  <!-- the flat threshold, and the sloping one -->
  <path d="M36 106 H 404" fill="none" stroke="var(--lred)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="10" y="109" class="lbl" fill="var(--lred)">0.49</text>
  <path d="M40 55 L 400 137.5" fill="none" stroke="var(--teal)" stroke-width="1.6"/>

  <!-- what the flat line actually did, band by band -->
  <g stroke="var(--muted)" stroke-width="1.1" fill="none">
    <path d="M40 154 V 162 H 400 V 154"/>
    <path d="M220 162 V 150"/>
    <path d="M340 162 V 150"/>
  </g>
  <g class="lbl" text-anchor="middle">
    <text x="130" y="176">all foreground</text>
    <text x="280" y="176">works</text>
    <text x="370" y="176">all background</text>
  </g>

  <text x="220" y="192" text-anchor="middle" class="formula">brighter than the line = foreground</text>
</svg>
