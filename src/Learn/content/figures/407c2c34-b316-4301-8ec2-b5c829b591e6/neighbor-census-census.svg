<svg viewBox="0 0 440 150" role="img" aria-label="A cell counts the live cells in the 3-by-3 block around it, subtracting itself, giving count 3; at the grid edge the neighbor index wraps around to the opposite side.">
  <text x="10" y="14" class="lbl-up">COUNT LIVE NEIGHBORS</text>
  <text x="286" y="14" class="lbl-up">EDGES WRAP</text>

  <!-- the world, 0s and 1s -->
  <g fill="none" stroke="var(--line)">
    <rect x="14" y="30" width="22" height="22" rx="3"/><rect x="36" y="30" width="22" height="22" rx="3"/><rect x="58" y="30" width="22" height="22" rx="3"/><rect x="80" y="30" width="22" height="22" rx="3"/><rect x="102" y="30" width="22" height="22" rx="3"/>
    <rect x="14" y="52" width="22" height="22" rx="3"/><rect x="36" y="52" width="22" height="22" rx="3"/><rect x="58" y="52" width="22" height="22" rx="3"/><rect x="80" y="52" width="22" height="22" rx="3"/><rect x="102" y="52" width="22" height="22" rx="3"/>
    <rect x="14" y="74" width="22" height="22" rx="3"/><rect x="36" y="74" width="22" height="22" rx="3"/><rect x="58" y="74" width="22" height="22" rx="3"/><rect x="80" y="74" width="22" height="22" rx="3"/><rect x="102" y="74" width="22" height="22" rx="3"/>
    <rect x="14" y="96" width="22" height="22" rx="3"/><rect x="36" y="96" width="22" height="22" rx="3"/><rect x="58" y="96" width="22" height="22" rx="3"/><rect x="80" y="96" width="22" height="22" rx="3"/><rect x="102" y="96" width="22" height="22" rx="3"/>
  </g>
  <g text-anchor="middle" style="font-size:10px">
    <text x="25" y="45" class="lbl">0</text><text x="47" y="45">1</text><text x="69" y="45" class="lbl">0</text><text x="91" y="45" class="lbl">0</text><text x="113" y="45">1</text>
    <text x="25" y="67" class="lbl">0</text><text x="47" y="67">1</text><text x="69" y="67" class="lbl">0</text><text x="91" y="67">1</text><text x="113" y="67" class="lbl">0</text>
    <text x="25" y="89" class="lbl">0</text><text x="47" y="89" class="lbl">0</text><text x="69" y="89" class="lbl">0</text><text x="91" y="89" class="lbl">0</text><text x="113" y="89">1</text>
    <text x="25" y="111">1</text><text x="47" y="111" class="lbl">0</text><text x="69" y="111" class="lbl">0</text><text x="91" y="111">1</text><text x="113" y="111" class="lbl">0</text>
  </g>
  <!-- 3x3 block + this cell -->
  <rect x="36" y="30" width="66" height="66" rx="4" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
  <rect x="58" y="52" width="22" height="22" rx="3" fill="none" stroke="var(--pink)" stroke-width="2"/>

  <!-- count -->
  <path class="arrow" d="M128 63 H 154" stroke-width="1.5"/>
  <path class="arrowhead" d="M160 63 l -7 -4 v 8 z"/>
  <rect x="166" y="50" width="96" height="26" rx="8" fill="none" stroke="var(--teal)" stroke-width="1.6"/>
  <text x="214" y="67" text-anchor="middle" style="font-size:10px" fill="var(--teal)">count = 3</text>
  <text x="214" y="94" text-anchor="middle" class="lbl">3×3 sum − self</text>

  <!-- wrap-around -->
  <g fill="none" stroke="var(--line)">
    <rect x="300" y="34" width="18" height="18" rx="3"/><rect x="318" y="34" width="18" height="18" rx="3"/><rect x="336" y="34" width="18" height="18" rx="3"/><rect x="354" y="34" width="18" height="18" rx="3"/>
    <rect x="300" y="52" width="18" height="18" rx="3"/><rect x="318" y="52" width="18" height="18" rx="3"/><rect x="336" y="52" width="18" height="18" rx="3"/><rect x="354" y="52" width="18" height="18" rx="3"/>
    <rect x="300" y="70" width="18" height="18" rx="3"/><rect x="318" y="70" width="18" height="18" rx="3"/><rect x="336" y="70" width="18" height="18" rx="3"/><rect x="354" y="70" width="18" height="18" rx="3"/>
    <rect x="300" y="88" width="18" height="18" rx="3"/><rect x="318" y="88" width="18" height="18" rx="3"/><rect x="336" y="88" width="18" height="18" rx="3"/><rect x="354" y="88" width="18" height="18" rx="3"/>
  </g>
  <rect x="354" y="52" width="18" height="18" rx="3" fill="none" stroke="var(--pink)" stroke-width="2"/>
  <rect x="300" y="52" width="18" height="18" rx="3" fill="none" stroke="var(--teal)" stroke-width="2"/>
  <path class="arrow" d="M374 61 h 12 q 10 0 10 10 v 34 q 0 10 -10 10 H 296 q -10 0 -10 -10 v -34 q 0 -10 10 -10" stroke-width="1.4"/>
  <path class="arrowhead" d="M302 61 l -7 -4 v 8 z"/>
  <text x="336" y="140" text-anchor="middle" class="lbl">(x + 1 + 16) % 16 → 0</text>
</svg>
