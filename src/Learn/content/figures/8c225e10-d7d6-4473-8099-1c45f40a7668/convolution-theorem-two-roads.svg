<svg viewBox="0 0 440 200" role="img" aria-label="Two routes to the same convolution. Along the top, the signal and the filter go straight into a sliding window that costs n times m products and produces the result. Along the bottom, both are transformed into spectra, multiplied one bin at a time, and the product is transformed back into that same result — so the square commutes and the expensive sliding window is never needed.">
  <text x="10" y="13" class="lbl-up">TWO ROADS, ONE ANSWER</text>

  <!-- ============ the direct road ============ -->
  <g fill="none" stroke="var(--line)">
    <rect x="14" y="26" width="46" height="20" rx="4"/>
    <rect x="14" y="52" width="46" height="20" rx="4"/>
  </g>
  <g style="font-size:10px" text-anchor="middle">
    <text x="37" y="40">x[n]</text>
    <text x="37" y="66">h[n]</text>
  </g>

  <g class="arrow" stroke-width="1.1">
    <path d="M60 36 H 80 V 46"/>
    <path d="M60 62 H 80 V 52"/>
    <path d="M80 49 H 87"/>
  </g>
  <path class="arrowhead" d="M92 49 l -6 -3.4 v 6.8 z"/>

  <rect x="94" y="31" width="138" height="36" rx="6" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
  <text x="163" y="47" text-anchor="middle" style="font-size:10px">slide &amp; sum</text>
  <text x="163" y="60" text-anchor="middle" class="lbl">n · m products</text>

  <path class="arrow" stroke-width="1.1" d="M232 49 H 246"/>
  <path class="arrowhead" d="M251 49 l -6 -3.4 v 6.8 z"/>

  <rect x="254" y="39" width="52" height="20" rx="4" fill="var(--teal)" fill-opacity=".16" stroke="var(--teal)" stroke-width="1.6"/>
  <text x="280" y="53" text-anchor="middle" style="font-size:10px" fill="var(--teal)">y[n]</text>

  <!-- ============ down into the frequency domain ============ -->
  <path class="arrow" stroke-width="1.1" d="M37 76 V 112"/>
  <path class="arrowhead" d="M37 117 l -3.4 -6 h 6.8 z"/>
  <text x="46" y="96" class="lbl">FFT</text>
  <text x="46" y="107" class="lbl">both</text>

  <!-- ============ the frequency road ============ -->
  <g fill="none" stroke="var(--line)">
    <rect x="14" y="122" width="46" height="20" rx="4"/>
    <rect x="14" y="148" width="46" height="20" rx="4"/>
  </g>
  <g style="font-size:10px" text-anchor="middle">
    <text x="37" y="136">X(k)</text>
    <text x="37" y="162">H(k)</text>
  </g>

  <g class="arrow" stroke-width="1.1">
    <path d="M60 132 H 80 V 142"/>
    <path d="M60 158 H 80 V 148"/>
    <path d="M80 145 H 87"/>
  </g>
  <path class="arrowhead" d="M92 145 l -6 -3.4 v 6.8 z"/>

  <rect x="94" y="127" width="138" height="36" rx="6" fill="var(--blue)" fill-opacity=".12" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="163" y="143" text-anchor="middle" style="font-size:10px" fill="var(--blue)">multiply, bin by bin</text>
  <text x="163" y="156" text-anchor="middle" class="lbl">one product per bin</text>

  <path class="arrow" stroke-width="1.1" d="M232 145 H 246"/>
  <path class="arrowhead" d="M251 145 l -6 -3.4 v 6.8 z"/>

  <rect x="254" y="135" width="52" height="20" rx="4" fill="none" stroke="var(--blue)" stroke-width="1.4"/>
  <text x="280" y="149" text-anchor="middle" style="font-size:10px" fill="var(--blue)">P(k)</text>

  <!-- ============ and back up ============ -->
  <path class="arrow" stroke-width="1.1" d="M306 145 H 332 V 54 H 311"/>
  <path class="arrowhead" d="M306 54 l 6 -3.4 v 6.8 z"/>
  <text x="338" y="96" class="lbl">inverse</text>
  <text x="338" y="107" class="lbl">FFT</text>

  <text x="220" y="192" text-anchor="middle" class="formula">conv(x, h) = IFFT( FFT(x) · FFT(h) )</text>
</svg>
