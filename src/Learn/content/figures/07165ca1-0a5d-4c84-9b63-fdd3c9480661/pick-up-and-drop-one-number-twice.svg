<svg viewBox="0 0 440 156" role="img" aria-label="A capacity bar drawn longer than the load bar beneath it; the gap between the two is highlighted and labelled delta, capped at maxCut. Two arrows leave that gap: one into a box reading height minus delta, the other into a box reading sediment plus delta. The rock loses exactly what the stream gains.">
  <text x="10" y="14" class="lbl-up">ONE NUMBER, TWO KERNELS</text>

  <text x="16" y="40" class="lbl">capacity = carry &#183; &#8730;drop &#183; water</text>
  <rect x="16" y="46" width="188" height="20" rx="4" fill="var(--blue)" fill-opacity=".18" stroke="var(--blue)" stroke-width="1.4"/>

  <text x="16" y="86" class="lbl">load = sediment[y][x]</text>
  <rect x="16" y="92" width="110" height="20" rx="4" fill="none" stroke="var(--line)" stroke-width="1.4"/>

  <!-- the gap between them, which is what changes hands -->
  <path d="M126 102 H 204" fill="none" stroke="var(--pink)" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M126 96 V 108" fill="none" stroke="var(--pink)" stroke-width="1.4"/>
  <path d="M204 96 V 108" fill="none" stroke="var(--pink)" stroke-width="1.4"/>
  <text x="165" y="128" text-anchor="middle" style="font-size:10px" fill="var(--pink)">&#948; = pickUp &#183; gap</text>
  <text x="165" y="142" text-anchor="middle" class="lbl">never more than maxCut</text>

  <!-- the same delta, spent twice -->
  <g fill="none" stroke="var(--pink)" stroke-width="1.4">
    <path d="M212 98 C 244 98, 244 60, 268 60"/>
    <path d="M212 106 C 244 106, 244 118, 268 118"/>
  </g>
  <g fill="var(--pink)">
    <path d="M274 60 l -7 -4 v 8 z"/>
    <path d="M274 118 l -7 -4 v 8 z"/>
  </g>

  <rect x="280" y="46" width="146" height="28" rx="8" fill="var(--surface)" stroke="var(--line)"/>
  <text x="353" y="64" text-anchor="middle" class="formula">height &#8722; &#948;</text>
  <text x="353" y="88" text-anchor="middle" class="lbl">erode</text>

  <rect x="280" y="104" width="146" height="28" rx="8" fill="var(--surface)" stroke="var(--line)"/>
  <text x="353" y="122" text-anchor="middle" class="formula">sediment + &#948;</text>
  <text x="353" y="146" text-anchor="middle" class="lbl">moveSediment</text>
</svg>
