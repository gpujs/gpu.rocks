<svg viewBox="0 0 440 152" role="img" aria-label="Left: a terrain profile with three marked cells. A dashed chord joins the left and right neighbours, straddling the middle cell, which is the central difference — a slope measured across two cells. Right: the same slope drawn as a surface normal leaning away from the rise, with two light rays arriving from the upper left; the angle between the normal and the light is what sets the brightness.">
  <text x="10" y="14" class="lbl-up">SLOPE FROM TWO NEIGHBOURS</text>

  <!-- left: the profile and the chord across it -->
  <path d="M16 116 L 50 106 L 96 82 L 142 60 L 190 50" fill="none" stroke="var(--line)" stroke-width="1.6"/>
  <path d="M50 106 L 142 60" fill="none" stroke="var(--blue)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="50" cy="106" r="3.5" fill="var(--blue)"/>
  <circle cx="142" cy="60" r="3.5" fill="var(--blue)"/>
  <circle cx="96" cy="82" r="4.5" fill="var(--pink)"/>
  <g text-anchor="middle" class="lbl">
    <text x="50" y="124">xl</text>
    <text x="96" y="100">x</text>
    <text x="142" y="78">xr</text>
  </g>
  <text x="96" y="42" text-anchor="middle" style="font-size:10px" fill="var(--blue)">straddles the cell</text>

  <line x1="212" y1="24" x2="212" y2="126" class="cellline"/>

  <!-- right: the same slope as a normal, and the light it faces -->
  <path d="M252 100 L 344 66" fill="none" stroke="var(--line)" stroke-width="1.8"/>
  <path d="M298 83 L 288 55" fill="none" stroke="var(--pink)" stroke-width="1.6"/>
  <path d="M286 49 l 6 4 -8 2 z" fill="var(--pink)"/>
  <text x="304" y="52" style="font-size:10px" fill="var(--pink)">n</text>

  <g fill="none" stroke="var(--amber)" stroke-width="1.3">
    <path d="M236 24 L 258 46"/>
    <path d="M256 20 L 274 38"/>
  </g>
  <g fill="var(--amber)">
    <path d="M262 50 l -8 -1 3 -6 z"/>
    <path d="M278 42 l -8 -1 3 -6 z"/>
  </g>
  <text x="228" y="42" style="font-size:10px" fill="var(--amber)">&#8467;</text>
  <text x="272" y="70" text-anchor="middle" class="lbl">&#952;</text>

  <rect x="336" y="66" width="80" height="28" rx="8" fill="var(--surface)" stroke="var(--line)"/>
  <text x="376" y="84" text-anchor="middle" class="formula">lit = cos &#952;</text>
  <text x="376" y="110" text-anchor="middle" class="lbl">&#952; = 0 &#8594; brightest</text>

  <text x="16" y="144" class="lbl">two cells apart, so the central difference carries the &#215; 0.5</text>
</svg>
