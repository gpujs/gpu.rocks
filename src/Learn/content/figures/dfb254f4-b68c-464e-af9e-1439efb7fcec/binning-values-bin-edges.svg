<svg viewBox="0 0 440 180" role="img" aria-label="Three adjacent bins, each half-open: bin 13 is 20 up to but not including 24, bin 14 is 24 up to 28, bin 15 is 28 to 32 inclusive. A sample of 25.6 falls in bin 14 and a sample of exactly 28 falls in bin 15, not 14. A sample equal to the maximum, 32, maps to a phantom bin 16 that no thread owns, and the clamp brings it back into bin 15.">
  <text x="10" y="14" class="lbl-up">ONE VALUE, ONE BIN</text>

  <!-- sample markers -->
  <g fill="var(--pink)" style="font-size:10px" text-anchor="middle">
    <text x="132" y="32">25.6</text>
    <text x="178" y="32">28.0</text>
  </g>
  <text x="254" y="32" text-anchor="middle" style="font-size:10px" fill="var(--lred)">32.0</text>

  <g fill="none" stroke="var(--pink)" stroke-width="1.3">
    <path d="M132 38 V 52"/>
    <path d="M178 38 V 46 Q 178 52 190 52"/>
  </g>
  <g fill="var(--pink)">
    <path d="M132 58 l -4 -7 h 8 z"/>
    <path d="M196 58 l -4 -7 h 8 z"/>
  </g>
  <path d="M256 38 Q 292 40 292 52" fill="none" stroke="var(--lred)" stroke-width="1.3"/>
  <path d="M292 58 l -4 -7 h 8 z" fill="var(--lred)"/>

  <!-- the bins -->
  <g fill="none" stroke="var(--line)">
    <rect x="26" y="62" width="76" height="34" rx="5"/>
    <rect x="102" y="62" width="76" height="34" rx="5"/>
  </g>
  <rect x="178" y="62" width="76" height="34" rx="5" fill="var(--teal)" fill-opacity=".14" stroke="var(--teal)" stroke-width="1.5"/>
  <rect x="254" y="62" width="76" height="34" rx="5" fill="none" stroke="var(--lred)" stroke-width="1.4" stroke-dasharray="4 3"/>

  <g text-anchor="middle">
    <text x="64" y="79" style="font-size:11px">13</text>
    <text x="64" y="91" class="lbl">[20, 24)</text>
    <text x="140" y="79" style="font-size:11px">14</text>
    <text x="140" y="91" class="lbl">[24, 28)</text>
    <text x="216" y="79" style="font-size:11px" fill="var(--teal)">15</text>
    <text x="216" y="91" class="lbl">[28, 32]</text>
    <text x="292" y="79" style="font-size:11px" fill="var(--lred)">16</text>
    <text x="292" y="91" class="lbl">✗ phantom</text>
  </g>

  <g class="lbl" text-anchor="middle">
    <text x="26" y="110">20</text>
    <text x="102" y="110">24</text>
    <text x="178" y="110">28</text>
    <text x="254" y="110">32</text>
  </g>
  <text x="338" y="79" class="lbl">no thread</text>
  <text x="338" y="91" class="lbl">owns it</text>

  <!-- the clamp folds the phantom back into the last real bin -->
  <path d="M292 116 Q 254 146 220 122" fill="none" stroke="var(--teal)" stroke-width="1.4"/>
  <path d="M216 116 l -4 8 h 8 z" fill="var(--teal)"/>
  <text x="300" y="140" style="font-size:10px" fill="var(--teal)">clamp → 15</text>

  <text x="220" y="170" text-anchor="middle" class="formula">bin = min(bins − 1, floor((v − lo) / span × bins))</text>
</svg>
