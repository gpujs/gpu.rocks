<svg viewBox="0 0 440 186" role="img" aria-label="Left: two threads both increment the same bin, both read 7 and both write 8, so one increment is lost. Right: one thread owns bin 5 and reads the whole array itself, counting the three values that belong to it, and writes only its own cell.">
  <!-- scatter panel -->
  <text x="12" y="14" class="lbl-up">SCATTER · bins[v]++</text>
  <g>
    <g fill="none" stroke="var(--lred)" stroke-width="1.5">
      <rect x="24" y="28" width="48" height="22" rx="6"/>
      <rect x="120" y="28" width="48" height="22" rx="6"/>
    </g>
    <g text-anchor="middle" style="font-size:10px" fill="var(--lred)">
      <text x="48" y="43">t0</text><text x="144" y="43">t1</text>
    </g>
    <text x="48" y="64" text-anchor="middle" class="lbl">v = 5</text>
    <text x="144" y="64" text-anchor="middle" class="lbl">v = 5</text>

    <g fill="none" stroke="var(--lred)" stroke-width="1.4" opacity=".85">
      <path d="M52 72 L 90 95"/>
      <path d="M140 72 L 116 95"/>
    </g>
    <g fill="var(--lred)">
      <path d="M96 100 l -7 -5 l 1 -6 z"/>
      <path d="M110 100 l 7 -5 l -1 -6 z"/>
    </g>

    <rect x="70" y="104" width="66" height="30" rx="6" fill="var(--lred)" fill-opacity=".12" stroke="var(--lred)" stroke-width="1.6"/>
    <text x="103" y="123" text-anchor="middle" style="font-size:11px" fill="var(--lred)">7 → 8</text>
    <text x="103" y="150" text-anchor="middle" class="lbl">bin 5</text>
    <text x="103" y="168" text-anchor="middle" style="font-size:10px" fill="var(--lred)">✗ two +1s, one lands</text>
    <text x="103" y="181" text-anchor="middle" class="lbl">the other is overwritten</text>
  </g>

  <line x1="220" y1="22" x2="220" y2="172" class="cellline"/>

  <!-- gather panel -->
  <text x="238" y="14" class="lbl-up">GATHER · one thread per bin</text>
  <g>
    <g fill="none" stroke="var(--line)">
      <rect x="240" y="28" width="20" height="20" rx="4"/>
      <rect x="286" y="28" width="20" height="20" rx="4"/>
      <rect x="332" y="28" width="20" height="20" rx="4"/>
      <rect x="378" y="28" width="20" height="20" rx="4"/>
      <rect x="401" y="28" width="20" height="20" rx="4"/>
    </g>
    <g fill="none" stroke="var(--teal)" stroke-width="1.6">
      <rect x="263" y="28" width="20" height="20" rx="4"/>
      <rect x="309" y="28" width="20" height="20" rx="4"/>
      <rect x="355" y="28" width="20" height="20" rx="4"/>
    </g>
    <g text-anchor="middle" style="font-size:10px">
      <text x="250" y="42" class="lbl">3</text>
      <text x="273" y="42" fill="var(--teal)">5</text>
      <text x="296" y="42" class="lbl">1</text>
      <text x="319" y="42" fill="var(--teal)">5</text>
      <text x="342" y="42" class="lbl">7</text>
      <text x="365" y="42" fill="var(--teal)">5</text>
      <text x="388" y="42" class="lbl">2</text>
      <text x="411" y="42" class="lbl">4</text>
    </g>

    <g fill="none" stroke="var(--teal)" stroke-width="1.3" opacity=".85">
      <path d="M273 54 L 314 108"/>
      <path d="M319 54 L 330 108"/>
      <path d="M365 54 L 348 108"/>
    </g>
    <g fill="var(--teal)">
      <path d="M318 114 l -6 -6 l 7 -3 z"/>
      <path d="M331 114 l -5 -7 l 8 -1 z"/>
      <path d="M346 114 l -1 -8 l 8 2 z"/>
    </g>

    <rect x="296" y="118" width="70" height="28" rx="7" fill="var(--teal)" fill-opacity=".18" stroke="var(--teal)" stroke-width="1.6"/>
    <text x="331" y="136" text-anchor="middle" style="font-size:11px" fill="var(--teal)">bin 5 = 3</text>
    <text x="331" y="168" text-anchor="middle" style="font-size:10px" fill="var(--teal)">✓ reads all, writes one</text>
    <text x="331" y="181" text-anchor="middle" class="lbl">its own cell, uncontested</text>
  </g>
</svg>
