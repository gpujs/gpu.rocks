<svg viewBox="0 0 440 182" role="img" aria-label="A timeline of video frames feeding a per-frame kernel. Frame zero passes straight through to become the starting average. Every frame after it enters a blend kernel together with the previous frame's average, carried forward along the highlighted path, and the blend produces the next average.">
  <text x="10" y="14" class="lbl-up">TIME →</text>

  <text x="10" y="46" class="lbl-up">FRAME</text>
  <text x="10" y="94" class="lbl-up">KERNEL</text>
  <text x="10" y="142" class="lbl-up">STATE</text>

  <!-- the frames -->
  <g fill="var(--surface)" stroke="var(--line)" stroke-width="1.3">
    <rect x="59" y="26" width="58" height="24" rx="6"/>
    <rect x="149" y="26" width="58" height="24" rx="6"/>
    <rect x="239" y="26" width="58" height="24" rx="6"/>
    <rect x="329" y="26" width="58" height="24" rx="6"/>
  </g>
  <g class="lbl" text-anchor="middle">
    <text x="88" y="42">f₀</text>
    <text x="178" y="42">f₁</text>
    <text x="268" y="42">f₂</text>
    <text x="358" y="42">f₃</text>
    <text x="410" y="42">…</text>
    <text x="410" y="138">…</text>
  </g>

  <!-- the kernel, once per frame after the first -->
  <g fill="var(--surface)" stroke="var(--blue)" stroke-width="1.5">
    <rect x="149" y="74" width="58" height="24" rx="7"/>
    <rect x="239" y="74" width="58" height="24" rx="7"/>
    <rect x="329" y="74" width="58" height="24" rx="7"/>
  </g>
  <g text-anchor="middle" style="font-size:9px;fill:var(--blue)">
    <text x="178" y="90">blend</text>
    <text x="268" y="90">blend</text>
    <text x="358" y="90">blend</text>
  </g>

  <!-- the running average -->
  <g fill="var(--teal)" fill-opacity=".12" stroke="var(--teal)" stroke-width="1.4">
    <rect x="59" y="122" width="58" height="24" rx="7"/>
    <rect x="149" y="122" width="58" height="24" rx="7"/>
    <rect x="239" y="122" width="58" height="24" rx="7"/>
    <rect x="329" y="122" width="58" height="24" rx="7"/>
  </g>
  <g text-anchor="middle" style="font-size:9px;fill:var(--teal)">
    <text x="88" y="138">avg₀</text>
    <text x="178" y="138">avg₁</text>
    <text x="268" y="138">avg₂</text>
    <text x="358" y="138">avg₃</text>
  </g>

  <!-- frame 0 is the seed: no kernel, no history -->
  <path class="arrow" d="M88 50 V 116" stroke-width="1.2"/>
  <path class="arrowhead" d="M88 122 l -4 -7 h 8 z"/>
  <text x="96" y="90" class="lbl">seed</text>

  <!-- frame in, average out -->
  <g class="arrow" stroke-width="1.2">
    <path d="M178 50 V 68"/><path d="M268 50 V 68"/><path d="M358 50 V 68"/>
    <path d="M178 98 V 116"/><path d="M268 98 V 116"/><path d="M358 98 V 116"/>
  </g>
  <g class="arrowhead">
    <path d="M178 74 l -4 -7 h 8 z"/><path d="M268 74 l -4 -7 h 8 z"/><path d="M358 74 l -4 -7 h 8 z"/>
    <path d="M178 122 l -4 -7 h 8 z"/><path d="M268 122 l -4 -7 h 8 z"/><path d="M358 122 l -4 -7 h 8 z"/>
  </g>

  <!-- and the edge that makes it video: last frame's output, back in -->
  <g fill="none" stroke="var(--pink)" stroke-width="1.5">
    <path d="M117 134 H 133 V 86 H 141"/>
    <path d="M207 134 H 223 V 86 H 231"/>
    <path d="M297 134 H 313 V 86 H 321"/>
  </g>
  <g fill="var(--pink)">
    <path d="M147 86 l -7 -4 v 8 z"/>
    <path d="M237 86 l -7 -4 v 8 z"/>
    <path d="M327 86 l -7 -4 v 8 z"/>
  </g>

  <path d="M10 166 H 30" fill="none" stroke="var(--pink)" stroke-width="1.5"/>
  <text x="36" y="170" class="lbl">state that outlives the frame</text>
</svg>
