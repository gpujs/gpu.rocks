<svg viewBox="0 0 440 152" role="img" aria-label="Two timelines for one frame of video against a 16.7 millisecond budget line. With a readback after every stage the three compute blocks are separated by three download blocks and the row runs past the budget line. With textures all the way through the same three compute blocks finish early and the rest of the frame is slack.">
  <text x="10" y="14" class="lbl-up">ONE FRAME AT 60 FPS</text>

  <!-- the budget -->
  <path d="M330 26 V 106" fill="none" stroke="var(--amber)" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="330" y="122" text-anchor="middle" style="font-size:10px;fill:var(--amber)">16.7 ms</text>

  <!-- row A: a download between every stage -->
  <text x="10" y="30" class="lbl-up">READBACK BETWEEN EVERY STAGE</text>
  <g fill="var(--blue)" fill-opacity=".16" stroke="var(--blue)" stroke-width="1.3">
    <rect x="10" y="36" width="56" height="22" rx="5"/>
    <rect x="118" y="36" width="78" height="22" rx="5"/>
    <rect x="248" y="36" width="52" height="22" rx="5"/>
  </g>
  <g fill="var(--lred)" fill-opacity=".16" stroke="var(--lred)" stroke-width="1.3">
    <rect x="66" y="36" width="52" height="22" rx="5"/>
    <rect x="196" y="36" width="52" height="22" rx="5"/>
    <rect x="300" y="36" width="52" height="22" rx="5"/>
  </g>
  <g text-anchor="middle" style="font-size:8px">
    <text x="38" y="51" fill="var(--blue)">lum</text>
    <text x="157" y="51" fill="var(--blue)">denoise</text>
    <text x="274" y="51" fill="var(--blue)">tone</text>
    <text x="92" y="51" fill="var(--lred)">read</text>
    <text x="222" y="51" fill="var(--lred)">read</text>
    <text x="326" y="51" fill="var(--lred)">read</text>
  </g>
  <text x="360" y="51" style="font-size:11px;fill:var(--lred)">✗</text>

  <!-- row B: nothing comes down until the end -->
  <text x="10" y="76" class="lbl-up">TEXTURES ALL THE WAY THROUGH</text>
  <g fill="var(--blue)" fill-opacity=".16" stroke="var(--blue)" stroke-width="1.3">
    <rect x="10" y="82" width="56" height="22" rx="5"/>
    <rect x="66" y="82" width="78" height="22" rx="5"/>
    <rect x="144" y="82" width="52" height="22" rx="5"/>
  </g>
  <rect x="196" y="82" width="134" height="22" rx="5" fill="var(--teal)" fill-opacity=".12" stroke="var(--teal)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <g text-anchor="middle" style="font-size:8px">
    <text x="38" y="97" fill="var(--blue)">lum</text>
    <text x="105" y="97" fill="var(--blue)">denoise</text>
    <text x="170" y="97" fill="var(--blue)">tone</text>
    <text x="263" y="97" fill="var(--teal)">slack</text>
  </g>

  <text x="10" y="142" class="lbl">identical arithmetic in both rows — only the traffic changed</text>
</svg>
