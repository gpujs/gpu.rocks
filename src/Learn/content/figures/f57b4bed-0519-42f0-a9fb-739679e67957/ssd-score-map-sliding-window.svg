  <!-- the template, laid over the scene at (4, 2) -->
  <rect x="82" y="76" width="45" height="45" rx="5" fill="var(--blue)" fill-opacity=".14" stroke="var(--blue)" stroke-width="1.6"/>

  <!-- the corner cell IS this thread's coordinate, and the cell it writes -->
