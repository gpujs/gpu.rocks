<svg viewBox="0 0 440 186" role="img" aria-label="A 3 by 3 template laid over a 9 by 6 scene with its top-left corner on cell (4, 2). The whole window is summed into a single score, which becomes cell (4, 2) of a 7 by 4 score map — one thread per candidate position, and a map smaller than the scene by the template size.">
  <text x="10" y="14" class="lbl-up">ONE THREAD, ONE CANDIDATE POSITION</text>
  <text x="104.5" y="38" text-anchor="middle" style="font-size:9px" fill="var(--blue)">the template, here</text>

  <!-- the scene -->
  <g fill="none" stroke="var(--line)">
    <rect x="22" y="46" width="15" height="15" rx="3"/><rect x="37" y="46" width="15" height="15" rx="3"/><rect x="52" y="46" width="15" height="15" rx="3"/><rect x="67" y="46" width="15" height="15" rx="3"/><rect x="82" y="46" width="15" height="15" rx="3"/><rect x="97" y="46" width="15" height="15" rx="3"/><rect x="112" y="46" width="15" height="15" rx="3"/><rect x="127" y="46" width="15" height="15" rx="3"/><rect x="142" y="46" width="15" height="15" rx="3"/>
