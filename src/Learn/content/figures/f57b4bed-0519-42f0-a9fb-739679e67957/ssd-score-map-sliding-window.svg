    <rect x="22" y="106" width="15" height="15" rx="3"/><rect x="37" y="106" width="15" height="15" rx="3"/><rect x="52" y="106" width="15" height="15" rx="3"/><rect x="67" y="106" width="15" height="15" rx="3"/><rect x="82" y="106" width="15" height="15" rx="3"/><rect x="97" y="106" width="15" height="15" rx="3"/><rect x="112" y="106" width="15" height="15" rx="3"/><rect x="127" y="106" width="15" height="15" rx="3"/><rect x="142" y="106" width="15" height="15" rx="3"/>
