    <rect x="258" y="106" width="15" height="15" rx="3"/><rect x="273" y="106" width="15" height="15" rx="3"/><rect x="288" y="106" width="15" height="15" rx="3"/><rect x="303" y="106" width="15" height="15" rx="3"/><rect x="318" y="106" width="15" height="15" rx="3"/><rect x="333" y="106" width="15" height="15" rx="3"/><rect x="348" y="106" width="15" height="15" rx="3"/>
  </g>
  <rect x="318" y="91" width="15" height="15" rx="3" fill="var(--teal)" fill-opacity=".22" stroke="var(--teal)" stroke-width="1.8"/>

  <text x="89.5" y="158" text-anchor="middle" class="lbl">scene 9 × 6 · corner (4, 2)</text>
  <text x="310.5" y="158" text-anchor="middle" class="lbl">score map 7 × 4 · cell (4, 2)</text>
  <text x="220" y="180" text-anchor="middle" class="formula">9 − 3 + 1 = 7 per axis&#160;&#160;·&#160;&#160;in the task, 96 − 8 + 1 = 89</text>
</svg>
