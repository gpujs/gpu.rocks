<svg viewBox="0 0 440 180" role="img" aria-label="Magnetisation against temperature. The exact Onsager curve for an infinite lattice, drawn dashed, sits near one at low temperature and falls vertically to zero at the critical temperature 2.269. The solid curve measured on this module's 128 by 128 lattice after 150 sweeps from an all-up start follows it closely up to about 2.1, then hangs on above the critical temperature and collapses between 2.375 and 2.5 instead of dropping vertically — the rounding a finite lattice and a finite run always produce.">
  <text x="10" y="14" class="lbl-up">|m| AGAINST TEMPERATURE · Tc = 2 / ln(1 + √2) = 2.269</text>

  <!-- gridlines -->
  <g stroke="var(--line)" stroke-width="1" opacity=".6">
    <path d="M56 40 H 400"/>
    <path d="M56 90 H 400"/>
  </g>

  <!-- axes -->
  <g stroke="var(--muted)" stroke-width="1.2" fill="none">
    <path d="M56 32 V 140"/>
    <path d="M56 140 H 404"/>
  </g>
  <g class="lbl" text-anchor="end">
    <text x="50" y="43">1.0</text>
    <text x="50" y="93">0.5</text>
    <text x="50" y="143">0</text>
  </g>
  <g class="lbl" text-anchor="middle">
    <text x="71.6" y="153">1.5</text>
    <text x="149.8" y="153">2.0</text>
    <text x="228.0" y="153">2.5</text>
    <text x="306.2" y="153">3.0</text>
    <text x="384.4" y="153">3.5</text>
    <text x="228" y="167">temperature (J / k_B)</text>
  </g>

  <!-- the critical temperature -->
  <path d="M191.9 32 V 140" stroke="var(--pink)" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
  <rect x="196" y="30" width="34" height="14" rx="3" fill="var(--surface)"/>
  <text x="199" y="41" style="font-size:10px" fill="var(--pink)">2.269</text>

  <!-- Onsager, exact, infinite lattice: dashed as well as muted -->
  <polyline fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="6 3" stroke-linejoin="round"
    points="71.6,41.4 79.5,41.7 87.3,42.0 95.1,42.5 102.9,43.0 110.7,43.6 118.5,44.3 126.4,45.2 134.2,46.2 142.0,47.4 149.8,48.9 157.6,50.7 165.5,53.1 173.3,56.4 181.1,61.5 187.3,69.3 188.9,72.8 190.5,78.7 191.3,84.4 191.7,92.5 191.9,105.8 191.9,140.0"/>
  <polyline fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="6 3"
    points="191.9,140.0 384.4,140.0"/>

  <!-- what this module's 128 x 128 lattice actually does -->
  <polyline fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linejoin="round"
    points="71.6,41.7 91.2,42.6 110.7,43.9 130.3,46.3 149.8,49.2 169.4,52.6 188.9,58.4 208.5,86.1 228.0,133.4 247.5,134.8 267.1,139.8 286.6,137.4 306.2,138.3 325.7,137.0 345.3,139.7 364.8,139.2 384.4,137.9"/>

  <!-- the slider's default sits here -->
  <circle cx="188.9" cy="58.4" r="4" fill="var(--surface)" stroke="var(--blue)" stroke-width="2"/>
  <path d="M172 100 L186 64" stroke="var(--blue)" stroke-width="1" stroke-dasharray="2 2" fill="none"/>
  <rect x="96" y="94" width="78" height="14" rx="3" fill="var(--surface)"/>
  <text x="170" y="104" text-anchor="end" style="font-size:10px" fill="var(--blue)">default 2.25</text>

  <!-- legend: a swatch as well as a colour, so the two curves are told apart
       by their dash pattern too -->
  <path d="M248 56 H 268" stroke="var(--blue)" stroke-width="2.2" fill="none"/>
  <text x="274" y="60" style="font-size:10px" fill="var(--blue)">measured, 128×128</text>
  <path d="M248 70 H 268" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="6 3" fill="none"/>
  <text x="274" y="74" class="lbl">Onsager, exact</text>

  <text x="24" y="177" class="lbl">150 sweeps from all-up: a finite lattice rounds the corner off</text>
</svg>
