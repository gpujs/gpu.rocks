<svg viewBox="0 0 440 220" role="img" aria-label="The complete bitonic network for eight elements: three stages and six passes of compare-exchanges. Stage 2 and stage 4 mix ascending and descending comparators to build bitonic runs; stage 8 is all ascending and finishes the sort. Every comparator's position is fixed in advance, with no dependence on the values.">
  <text x="10" y="14" class="lbl-up">THE BITONIC NETWORK, n = 8</text>

  <g class="lbl" text-anchor="middle">
    <text x="66" y="38">stage 2</text>
    <text x="144" y="38">stage 4</text>
    <text x="277" y="38">stage 8</text>
  </g>
  <g stroke="var(--line)" stroke-dasharray="3 4">
    <path d="M96 44 V 186"/>
    <path d="M192 44 V 186"/>
  </g>

  <!-- the eight wires -->
  <g stroke="var(--line)">
    <path d="M30 52 H 366"/><path d="M30 70 H 366"/><path d="M30 88 H 366"/><path d="M30 106 H 366"/>
    <path d="M30 124 H 366"/><path d="M30 142 H 366"/><path d="M30 160 H 366"/><path d="M30 178 H 366"/>
  </g>
  <g class="lbl" text-anchor="middle">
    <text x="16" y="55">0</text><text x="16" y="73">1</text><text x="16" y="91">2</text><text x="16" y="109">3</text>
    <text x="16" y="127">4</text><text x="16" y="145">5</text><text x="16" y="163">6</text><text x="16" y="181">7</text>
  </g>

  <!-- ascending comparators: the larger value goes to the higher index -->
  <g stroke="var(--blue)" stroke-width="1.3" fill="none">
    <path d="M66 52 V 70"/><path d="M66 124 V 142"/>
    <path d="M118 52 V 88"/><path d="M126 70 V 106"/>
    <path d="M162 52 V 70"/><path d="M162 88 V 106"/>
    <path d="M216 52 V 124"/><path d="M224 70 V 142"/><path d="M232 88 V 160"/><path d="M240 106 V 178"/>
    <path d="M280 52 V 88"/><path d="M288 70 V 106"/><path d="M280 124 V 160"/><path d="M288 142 V 178"/>
    <path d="M330 52 V 70"/><path d="M330 88 V 106"/><path d="M330 124 V 142"/><path d="M330 160 V 178"/>
  </g>
  <g fill="var(--blue)">
    <circle cx="66" cy="52" r="2.2"/><circle cx="66" cy="124" r="2.2"/>
    <circle cx="118" cy="52" r="2.2"/><circle cx="126" cy="70" r="2.2"/>
    <circle cx="162" cy="52" r="2.2"/><circle cx="162" cy="88" r="2.2"/>
    <circle cx="216" cy="52" r="2.2"/><circle cx="224" cy="70" r="2.2"/><circle cx="232" cy="88" r="2.2"/><circle cx="240" cy="106" r="2.2"/>
    <circle cx="280" cy="52" r="2.2"/><circle cx="288" cy="70" r="2.2"/><circle cx="280" cy="124" r="2.2"/><circle cx="288" cy="142" r="2.2"/>
    <circle cx="330" cy="52" r="2.2"/><circle cx="330" cy="88" r="2.2"/><circle cx="330" cy="124" r="2.2"/><circle cx="330" cy="160" r="2.2"/>
    <path d="M66 70 l -3.5 -6.5 h 7 z"/><path d="M66 142 l -3.5 -6.5 h 7 z"/>
    <path d="M118 88 l -3.5 -6.5 h 7 z"/><path d="M126 106 l -3.5 -6.5 h 7 z"/>
    <path d="M162 70 l -3.5 -6.5 h 7 z"/><path d="M162 106 l -3.5 -6.5 h 7 z"/>
    <path d="M216 124 l -3.5 -6.5 h 7 z"/><path d="M224 142 l -3.5 -6.5 h 7 z"/>
    <path d="M232 160 l -3.5 -6.5 h 7 z"/><path d="M240 178 l -3.5 -6.5 h 7 z"/>
    <path d="M280 88 l -3.5 -6.5 h 7 z"/><path d="M288 106 l -3.5 -6.5 h 7 z"/>
    <path d="M280 160 l -3.5 -6.5 h 7 z"/><path d="M288 178 l -3.5 -6.5 h 7 z"/>
    <path d="M330 70 l -3.5 -6.5 h 7 z"/><path d="M330 106 l -3.5 -6.5 h 7 z"/>
    <path d="M330 142 l -3.5 -6.5 h 7 z"/><path d="M330 178 l -3.5 -6.5 h 7 z"/>
  </g>

  <!-- descending comparators: the larger value goes to the LOWER index -->
  <g stroke="var(--amber)" stroke-width="1.3" fill="none">
    <path d="M66 88 V 106"/><path d="M66 160 V 178"/>
    <path d="M118 124 V 160"/><path d="M126 142 V 178"/>
    <path d="M162 124 V 142"/><path d="M162 160 V 178"/>
  </g>
  <g fill="var(--amber)">
    <circle cx="66" cy="106" r="2.2"/><circle cx="66" cy="178" r="2.2"/>
    <circle cx="118" cy="160" r="2.2"/><circle cx="126" cy="178" r="2.2"/>
    <circle cx="162" cy="142" r="2.2"/><circle cx="162" cy="178" r="2.2"/>
    <path d="M66 88 l -3.5 6.5 h 7 z"/><path d="M66 160 l -3.5 6.5 h 7 z"/>
    <path d="M118 124 l -3.5 6.5 h 7 z"/><path d="M126 142 l -3.5 6.5 h 7 z"/>
    <path d="M162 124 l -3.5 6.5 h 7 z"/><path d="M162 160 l -3.5 6.5 h 7 z"/>
  </g>

  <g class="lbl" text-anchor="middle">
    <text x="66" y="196">s=1</text>
    <text x="122" y="196">s=2</text><text x="162" y="196">s=1</text>
    <text x="228" y="196">s=4</text><text x="284" y="196">s=2</text><text x="330" y="196">s=1</text>
  </g>

  <path d="M370 52 h 5 V 178 h -5" fill="none" stroke="var(--teal)" stroke-width="1.4"/>
  <text x="382" y="118" style="font-size:10px;fill:var(--teal)">sorted</text>

  <text x="196" y="214" text-anchor="middle" class="lbl">each arrow points at the end that keeps the larger value</text>
</svg>
