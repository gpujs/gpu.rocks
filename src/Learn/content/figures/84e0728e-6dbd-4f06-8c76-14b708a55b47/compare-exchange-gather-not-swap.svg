<svg viewBox="0 0 440 196" role="img" aria-label="Left: a swap needs one thread to write both cells of the pair, which a kernel cannot do. Right: the same compare-exchange as a gather — both threads read both values, and each writes only its own cell, so the minimum lands at the low index and the maximum at the high one.">
  <text x="10" y="14" class="lbl-up">SWAP VS COMPARE-EXCHANGE</text>
  <line x1="216" y1="26" x2="216" y2="186" class="cellline"/>

  <!-- left: one thread trying to write both cells of the pair -->
  <g class="lbl" text-anchor="middle">
    <text x="76" y="26">6</text><text x="140" y="26">7</text>
  </g>
  <g fill="none" stroke="var(--line)">
    <rect x="52" y="32" width="48" height="24" rx="4"/>
    <rect x="116" y="32" width="48" height="24" rx="4"/>
  </g>
  <g style="font-size:10px" text-anchor="middle">
    <text x="76" y="48">8</text><text x="140" y="48">3</text>
  </g>

  <g fill="none" stroke="var(--lred)" stroke-width="1.3">
    <path d="M94 88 L 79 66"/>
    <path d="M122 88 L 137 66"/>
  </g>
  <g fill="var(--lred)">
    <path d="M77 59 l -3.5 7.5 h 7 z"/>
    <path d="M139 59 l -3.5 7.5 h 7 z"/>
  </g>
  <rect x="74" y="88" width="68" height="22" rx="6" fill="none" stroke="var(--lred)" stroke-width="1.5"/>
  <text x="108" y="103" text-anchor="middle" style="font-size:10px;fill:var(--lred)">1 thread</text>
  <text x="108" y="134" text-anchor="middle" style="font-size:12px;fill:var(--lred)">✗</text>
  <text x="108" y="158" text-anchor="middle" class="lbl">writes two cells</text>
  <text x="108" y="180" text-anchor="middle" style="font-size:10px;fill:var(--lred)">✗ swap</text>

  <!-- right: two threads, each reading both and writing only its own cell -->
  <g class="lbl" text-anchor="middle">
    <text x="296" y="26">6</text><text x="360" y="26">7</text>
  </g>
  <g fill="none" stroke="var(--line)">
    <rect x="272" y="32" width="48" height="24" rx="4"/>
    <rect x="336" y="32" width="48" height="24" rx="4"/>
  </g>
  <g style="font-size:10px" text-anchor="middle">
    <text x="296" y="48">8</text><text x="360" y="48">3</text>
  </g>

  <!-- t6 reads both (pink: follow this one) -->
  <g fill="none" stroke="var(--pink)" stroke-width="1.2">
    <path d="M284 58 L 284 79"/>
    <path d="M348 58 L 310 79"/>
  </g>
  <g fill="var(--pink)">
    <path d="M284 86 l -3.5 -7 h 7 z"/>
    <path d="M310 86 l -3.5 -7 h 7 z"/>
  </g>
  <!-- t7 reads both -->
  <g fill="none" stroke="var(--muted)" stroke-width="1.1" opacity=".65">
    <path d="M308 58 L 346 79"/>
    <path d="M372 58 L 372 79"/>
  </g>
  <g fill="var(--muted)" opacity=".65">
    <path d="M346 86 l -3.5 -7 h 7 z"/>
    <path d="M372 86 l -3.5 -7 h 7 z"/>
  </g>

  <rect x="272" y="88" width="48" height="22" rx="6" fill="none" stroke="var(--pink)" stroke-width="1.5"/>
  <rect x="336" y="88" width="48" height="22" rx="6" fill="none" stroke="var(--muted)"/>
  <text x="296" y="103" text-anchor="middle" style="font-size:10px;fill:var(--pink)">t6</text>
  <text x="360" y="103" text-anchor="middle" class="lbl">t7</text>

  <g fill="none" stroke="var(--teal)" stroke-width="1.4">
    <path d="M296 110 V 133"/>
    <path d="M360 110 V 133"/>
  </g>
  <g fill="var(--teal)">
    <path d="M296 140 l -4 -7 h 8 z"/>
    <path d="M360 140 l -4 -7 h 8 z"/>
  </g>
  <g fill="var(--teal)" fill-opacity=".18" stroke="var(--teal)" stroke-width="1.6">
    <rect x="272" y="142" width="48" height="24" rx="4"/>
    <rect x="336" y="142" width="48" height="24" rx="4"/>
  </g>
  <g style="font-size:10px" text-anchor="middle" fill="var(--teal)">
    <text x="296" y="158">3</text><text x="360" y="158">8</text>
  </g>
  <text x="266" y="158" text-anchor="end" class="lbl">min</text>
  <text x="390" y="158" class="lbl">max</text>
  <text x="330" y="180" text-anchor="middle" style="font-size:10px;fill:var(--teal)">✓ compare-exchange</text>
</svg>
