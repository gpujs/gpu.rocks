<svg viewBox="0 0 440 150" role="img" aria-label="Thread 0 reads elements 0, 64 and 128: each of the 64 threads sums a strided slice, so at every step of the loop neighbouring threads read neighbouring elements.">
  <text x="10" y="12" class="lbl-up">64 THREADS, STRIDE 64</text>

  <!-- pass labels -->
  <text x="74" y="26" text-anchor="middle" class="lbl">i = 0</text>
  <text x="194" y="26" text-anchor="middle" class="lbl">i = 1</text>
  <text x="314" y="26" text-anchor="middle" class="lbl">i = 2</text>

  <!-- data cells, three strided groups -->
  <g fill="none" stroke="var(--line)">
    <rect x="52" y="32" width="20" height="20" rx="4"/><rect x="74" y="32" width="20" height="20" rx="4"/><rect x="96" y="32" width="20" height="20" rx="4"/>
    <rect x="172" y="32" width="20" height="20" rx="4"/><rect x="194" y="32" width="20" height="20" rx="4"/><rect x="216" y="32" width="20" height="20" rx="4"/>
    <rect x="292" y="32" width="20" height="20" rx="4"/><rect x="314" y="32" width="20" height="20" rx="4"/><rect x="336" y="32" width="20" height="20" rx="4"/>
  </g>
  <rect x="30" y="32" width="20" height="20" rx="4" fill="none" stroke="var(--pink)" stroke-width="1.6"/>
  <rect x="150" y="32" width="20" height="20" rx="4" fill="none" stroke="var(--pink)" stroke-width="1.6"/>
  <rect x="270" y="32" width="20" height="20" rx="4" fill="none" stroke="var(--pink)" stroke-width="1.6"/>
  <g style="font-size:9px" text-anchor="middle">
    <text x="40" y="46">0</text><text x="62" y="46">1</text><text x="84" y="46">2</text><text x="106" y="46">3</text>
    <text x="160" y="46">64</text><text x="182" y="46">65</text><text x="204" y="46">66</text><text x="226" y="46">67</text>
    <text x="280" y="46">128</text><text x="302" y="46">129</text><text x="324" y="46">130</text><text x="346" y="46">131</text>
  </g>
  <text x="122" y="46" class="lbl">…</text>
  <text x="242" y="46" class="lbl">…</text>
  <text x="362" y="46" class="lbl">… of 4096</text>

  <!-- thread chips -->
  <rect x="30" y="92" width="36" height="22" rx="6" fill="none" stroke="var(--pink)" stroke-width="1.6"/>
  <text x="48" y="106" text-anchor="middle" style="font-size:10px" fill="var(--pink)">t0</text>
  <g fill="none" stroke="var(--blue)" stroke-width="1.4">
    <rect x="76" y="92" width="36" height="22" rx="6"/>
    <rect x="122" y="92" width="36" height="22" rx="6"/>
    <rect x="168" y="92" width="36" height="22" rx="6"/>
  </g>
  <g style="font-size:10px" text-anchor="middle" fill="var(--blue)">
    <text x="94" y="106">t1</text><text x="140" y="106">t2</text><text x="186" y="106">t3</text>
  </g>
  <text x="214" y="106" class="lbl">… × 64</text>

  <!-- t0's three strided reads -->
  <g fill="none" stroke="var(--pink)" stroke-width="1.2">
    <path d="M44 90 L 40.5 58"/>
    <path d="M52 90 Q 100 72 156 57"/>
    <path d="M58 90 Q 160 78 274 58"/>
  </g>
  <g fill="var(--pink)">
    <path d="M40 52 l -4 7.5 h 8.5 z"/>
    <path d="M160 52 l -8.5 2 5 7 z"/>
    <path d="M280 52 l -8.5 2 4.5 7 z"/>
  </g>

  <text x="220" y="140" text-anchor="middle" class="formula">read i of thread x → data[i * 64 + x]</text>
</svg>
