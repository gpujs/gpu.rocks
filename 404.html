<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // The site was hash-routed until mid-2026, so old links look like
      // gpu.rocks/#/learn/1-2/3. Rewrite them onto real paths before the app
      // boots. replaceState only — never location.replace: a real navigation
      // here loops forever in webviews that re-open the originally requested
      // URL on instant redirects (seen in Telegram's in-app browser). Every
      // path serves this same shell, so the SPA boots correctly on the
      // rewritten URL with no network round-trip at all. Plain in-page
      // anchors don't start with "#/" and are left alone.
      (function () {
        var hash = window.location.hash;
        var path = window.location.pathname;
        var target = null;
        if (hash.length > 1 && hash.charAt(1) === '/') {
          target = hash.slice(1) + window.location.search;
        } else if (path.length > 1 && path.charAt(path.length - 1) === '/') {
          // GitHub Pages 301-redirects directory URLs to a trailing slash
          // (/learn → /learn/). Strip it so the address bar shows the
          // canonical path.
          target = path.replace(/\/+$/, '') + window.location.search + hash;
        }
        if (target !== null) {
          try {
            window.history.replaceState(null, '', target);
          } catch (e) {
            // sandboxed webview without history access — boot on the URL as-is
          }
        }
      })();
    </script>
    <script>
      // Boot-failure reporter. If the app never mounts (in-app browsers are
      // the usual culprits — see the Telegram blank-page report), show what
      // went wrong instead of a silent dark page. ES5 on purpose: this must
      // run on engines too old for the main bundle, which is exactly when a
      // syntax-level failure would otherwise be invisible.
      (function () {
        var firstError = null;
        function remember(message) {
          if (!firstError && message) firstError = String(message).slice(0, 300);
        }
        window.addEventListener('error', function (e) {
          remember(e.message || (e.target && e.target.src && 'failed to load ' + e.target.src));
          window.__firstBootError = firstError;
        }, true);
        // On-device inspector for webviews that can't be attached to Safari's
        // remote Web Inspector (Telegram et al opt out of WKWebView
        // inspectability). Open any page with ?debug to get console/network
        // panels rendered in-page. Self-hosted, loaded only on demand.
        if (/[?&]debug\b/.test(window.location.search)) {
          var eruda = document.createElement('script');
          eruda.src = '/debug/eruda.js';
          eruda.onload = function () {
            window.eruda.init();
            if (firstError) console.error('boot error before inspector loaded:', firstError);
          };
          document.head.appendChild(eruda);
        }
        window.addEventListener('unhandledrejection', function (e) {
          remember(e.reason && (e.reason.message || e.reason));
        });
        function check(finalTry) {
          var root = document.getElementById('root');
          if (!root || root.childNodes.length > 0) return; // mounted — all good
          if (!firstError && !finalTry) { setTimeout(function () { check(true); }, 8000); return; }
          var panel = document.createElement('div');
          panel.setAttribute('style',
            'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;' +
            'background:#171040;color:#f6f7f8;border:1px solid #ff79c6;border-radius:10px;' +
            'padding:14px 16px;font:14px/1.5 -apple-system,system-ui,sans-serif;');
          panel.innerHTML =
            '<b>This page failed to start.</b><br>' +
            (firstError
              ? '<code style="font-size:12px;word-break:break-all;color:#ff79c6;">' +
                firstError.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</code><br>'
              : '') +
            'If you are in an in-app browser (Telegram, Instagram…), try ' +
            '“Open in Browser” from its menu. ' +
            '<a href="https://github.com/gpujs/gpu.rocks/issues/31" style="color:#20a4f3;">Report this</a>';
          document.body.appendChild(panel);
        }
        setTimeout(function () { check(false); }, 7000);
      })();
    </script>
